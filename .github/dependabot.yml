version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    groups:
      # Les paquets @nestjs/* sont publies ensemble et se referencent par version
      # proche : les monter separement produit N PR dont chacune rend les autres
      # conflictuelles sur package-lock.json — il a fallu trois passes de rebase
      # pour absorber les 6 PR NestJS du 2026-05-17. Une PR groupee suffit.
      nestjs:
        patterns:
          - "@nestjs/*"
      # Les mises a jour d'outillage non risquees arrivent en une PR au lieu de N.
      dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    groups:
      # Les bumps d'actions ne touchent que les workflows : les grouper evite
      # cinq PR triviales par semaine sans rien perdre en tracabilite.
      github-actions:
        patterns:
          - "*"
    # SECURITY: Trivy was compromised in a supply chain attack (March 2026, GHSA-69fq-xp46-6x23).
    # Pin manuel sur v0.35.0 verified safe (SHA 57a97c7e). Dependabot a deja contourne cette
    # regle sur le frontend (PR #164, 2026-04-29) en bumpant en v0.36.0 sans verification. On
    # ignore desormais les bumps automatiques de cette action — toute mise a jour passe par
    # revue manuelle. Voir aussi frontend/.github/dependabot.yml pour le meme bloc.
    ignore:
      - dependency-name: "aquasecurity/trivy-action"
