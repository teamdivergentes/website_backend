name: CICD

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*" ]  # Format: vXX.YY.ZZ
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.github/dependabot.yml'
      - 'BACKLOG/**'
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      deploy_tag:
        description: "Tag de release a (re)deployer en PROD, ex: v1.5.0. Vide = CI normale."
        required: false
        type: string

# ═══════════════════════════════════════════════════════════════════════════
# REPRISE MANUELLE D'UNE RELEASE (EPIC-39 / US3)
# ═══════════════════════════════════════════════════════════════════════════
# Deux commandes, deux usages. Ne pas les confondre.
#
# 1) Rejouer TOUT le pipeline sur un tag existant (rebuild reel de :RELEASE) :
#
#        gh workflow run cicd.yml --ref vX.Y.Z
#
#    `determine-tags.sh` detecte `refs/tags/v*` -> TAG_SUFFIX=RELEASE : l'image
#    est reconstruite, scannee (Trivy), smoke-testee puis deployee en PROD.
#    C'est le chemin a privilegier quand le tag git existe. Il n'etait documente
#    nulle part avant l'EPIC-39 — d'ou une reprise SSH manuelle sur le VPS lors
#    de l'incident du 2026-07-22.
#
# 2) Redeployer une release DEJA construite, sans repasser par la CI complete :
#
#        Actions -> CICD -> Run workflow -> deploy_tag = vX.Y.Z
#
#    Chemin de secours (garde-fou anti tag-fantome, EPIC-24). Il ne rebuild pas
#    quand l'image X.Y.Z-RELEASE est deja sur GHCR. Depuis l'EPIC-39/US3, si
#    elle est ABSENTE (supprimee par le cleanup GHCR, jamais publiee...), le job
#    `release-rebuild` la reconstruit automatiquement depuis les sources du tag
#    puis smoke-release la valide — au lieu d'echouer en `exit 1` comme avant.
# ═══════════════════════════════════════════════════════════════════════════

env:
  NODE_VERSION: 22

# Cancel in-progress runs on the same branch/PR when a new push arrives.
# Avoids accumulation of stale runs (e.g. 3 consecutive update-branch pushes = 3 runs
# that would queue up and monopolize the 2 self-hosted runners).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# ═══════════════════════════════════════════════════════════════════════════
# POLITIQUE DE RUNNERS (EPIC-39 / US2 — incident du 2026-07-22)
# ═══════════════════════════════════════════════════════════════════════════
# Contexte : les 2 runners self-hosted du VPS ont ete indisponibles ~9h
# (version de runner depreciee par GitHub, aucun job route, runs bloques en
# `queued` sans erreur visible). 10 des 16 jobs de ce workflow tournaient sur
# ces 2 runners, partages avec le repo frontend : la CI a ete TOTALEMENT gelee.
#
# Regle : un job ne reste sur self-hosted QUE s'il a besoin du contexte VPS.
#
#   ubuntu-latest (GitHub-hosted)      | self-hosted (contexte VPS requis)
#   -----------------------------------|-----------------------------------
#   build, lint, test-unit             | docker      (cache buildx local)
#   semgrep, sonarqube, mutation-test  | scan-image  (image locale au daemon)
#   deploy-*, release, pr-report       | smoke-release (boot conteneur local)
#   check-tag-run, workflow-status     | test-e2e    (services docker VPS)
#
# Consequence : une panne des runners self-hosted ne bloque plus que la partie
# build image / smoke / deploy — lint, tests, SAST et Sonar continuent de tourner.
#
# CACHE — point de vigilance : `actions/cache` est un cache DISTANT partage par
# tous les runners du repo. Les cles node_modules sont donc scopees par
# `runner.environment` (`github-hosted` / `self-hosted`) : un node_modules
# construit sur l'image du VPS ne doit jamais etre restaure sur un runner
# GitHub-hosted (et inversement) — binaires natifs / layout potentiellement
# divergents. `runner.os` seul vaut "Linux" des deux cotes et ne suffit pas.
# ═══════════════════════════════════════════════════════════════════════════

jobs:
  build:
    # Run on push/pull_request/workflow_dispatch.
    # pull_request_review and issue_comment are handled by downstream jobs directly.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    # EPIC-39/US2 — bascule self-hosted -> GitHub-hosted.
    # JUSTIFICATION du choix pour `build` : ce job ne fait que compiler
    # (`npm ci` + `prisma generate` + `nest build`). Il ne publie AUCUN
    # artefact consomme en aval (l'image Docker est reconstruite from source
    # par le Dockerfile multi-stage, et lint/test-unit refont leur propre
    # checkout+install). Sa seule "sortie" partagee est le cache npm/node_modules,
    # qui est un cache DISTANT GitHub, accessible depuis n'importe quel runner.
    # Aucune dependance au daemon Docker du VPS ni au reseau interne.
    # C'est de plus le job gate de tout le pipeline (`needs: build` partout) :
    # le laisser sur self-hosted revenait a faire dependre 100% de la CI de la
    # sante des 2 runners du VPS — exactement le gel observe le 2026-07-22.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      build-status: ${{ steps.build.outcome }}
      # Actor classification — propagated to downstream jobs to skip heavy
      # jobs on Dependabot PRs that don't justify a full pipeline run.
      #
      # is-dependabot-actions : PR bumps a GitHub Action only (.github/workflows)
      #   -> skip everything except pr-report + workflow-status
      # is-dependabot-dev     : PR bumps a devDependency (minor/patch npm)
      #   -> skip e2e, mutation-test, docker, scan-image, deploy-*, release
      # Dependabot prod dep bumps (major or prod): treated as human PRs (full pipeline)
      is-dependabot-actions: ${{ steps.actor.outputs.is-dependabot-actions }}
      is-dependabot-dev: ${{ steps.actor.outputs.is-dependabot-dev }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Classify PR actor and dependency type
        id: actor
        run: |
          IS_DEP_ACTIONS=false
          IS_DEP_DEV=false

          # Classification basee uniquement sur le prefixe de branche, pas sur github.actor.
          # Quand un humain re-run la CI ou force-push sur une branche Dependabot,
          # github.actor devient l'humain — la classification basee sur l'acteur perd
          # alors la branche et reactive le pipeline complet (Sonar inclus), ce qui
          # bloque les bumps Dependabot meme triviaux a cause du QG.
          BRANCH="${{ github.head_ref }}"

          # dependabot/github_actions/... -> only action bumps, no code change
          if [[ "$BRANCH" == dependabot/github_actions/* ]]; then
            IS_DEP_ACTIONS=true
            echo "Dependabot branch (actions): $BRANCH"
            echo "Classified as: github_actions bump (skip all except pr-report)"

          # dependabot/npm_and_yarn/... -> check package.json to classify
          elif [[ "$BRANCH" == dependabot/npm_and_yarn/* ]]; then
            echo "Dependabot branch (npm): $BRANCH"
            PKG_HINT=$(echo "$BRANCH" | sed 's|dependabot/npm_and_yarn/||' | tr '/_-' ' ' | tr '[:upper:]' '[:lower:]')
            echo "Package hint: $PKG_HINT"

            # Classify as devDep if the package name fragment matches a devDependency key
            if node -e "
              const pkg = require('./package.json');
              const hint = process.argv[1].toLowerCase();
              const devKeys = Object.keys(pkg.devDependencies || {}).map(k => k.toLowerCase().replace(/[@\/]/g, ''));
              const isDev = devKeys.some(k => hint.includes(k) || k.includes(hint.split(' ')[0]));
              process.exit(isDev ? 0 : 1);
            " "$PKG_HINT" 2>/dev/null; then
              IS_DEP_DEV=true
              echo "Classified as: devDependency bump (skip docker/e2e/deploy)"
            else
              echo "Classified as: prod/unknown dependency bump (full pipeline)"
            fi
          fi

          echo "is-dependabot-actions=$IS_DEP_ACTIONS" >> $GITHUB_OUTPUT
          echo "is-dependabot-dev=$IS_DEP_DEV" >> $GITHUB_OUTPUT

      - name: Setup Node
        # Skip full setup for action-only bumps (no code to build)
        if: steps.actor.outputs.is-dependabot-actions != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        if: steps.actor.outputs.is-dependabot-actions != 'true'
        id: cache-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          # EPIC-39/US2 : cle scopee par type de runner. `actions/cache` est un
          # cache DISTANT partage par TOUS les runners du repo ; sans ce scope,
          # un node_modules produit sur l'image du VPS serait restaure tel quel
          # sur ubuntu-latest (et inversement). `runner.os` vaut "Linux" des deux
          # cotes et ne discrimine rien.
          key: ${{ runner.os }}-${{ runner.environment }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.actor.outputs.is-dependabot-actions != 'true' && steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate Prisma Client
        if: steps.actor.outputs.is-dependabot-actions != 'true'
        run: npx prisma generate

      - name: Build NestJS
        if: steps.actor.outputs.is-dependabot-actions != 'true'
        id: build
        run: npm run build

      # For github_actions bumps there is no code to build — mark as success via echo
      - name: Skip build (github_actions bump)
        if: steps.actor.outputs.is-dependabot-actions == 'true'
        run: echo "Skipping build — github_actions Dependabot bump, no application code changed."

  lint:
    # EPIC-39/US2 : ESLint n'a aucun besoin du contexte VPS (pas de docker,
    # pas de service, pas de reseau interne). Bascule sur GitHub-hosted pour
    # liberer les 2 runners self-hosted et rester disponible s'ils tombent.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    # Skip for github_actions bumps (no code changed)
    if: |
      needs.build.result == 'success' &&
      needs.build.outputs.is-dependabot-actions != 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          # EPIC-39/US2 : cle scopee par type de runner. `actions/cache` est un
          # cache DISTANT partage par TOUS les runners du repo ; sans ce scope,
          # un node_modules produit sur l'image du VPS serait restaure tel quel
          # sur ubuntu-latest (et inversement). `runner.os` vaut "Linux" des deux
          # cotes et ne discrimine rien.
          key: ${{ runner.os }}-${{ runner.environment }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        # --max-warnings=0 enforced in package.json lint script (EPIC-19).
        # CI fails on any ESLint warning, not just errors.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run lint

  # Fast job: unit tests only (Jest, no E2E).
  # Runs on every push/PR (except github_actions bumps) — gating job for Docker and deployments.
  # No PostgreSQL service needed: all specs mock PrismaService (no real DB connection).
  # Schema drift validation is done by the Husky pre-push hook (backend/prisma/* changes).
  test-unit:
    # EPIC-39/US2 : les specs unitaires mockent toutes PrismaService — aucun
    # service Postgres, aucun daemon Docker, aucun acces VPS n'est necessaire.
    # Le job ne consomme rien produit par `build` sur le runner : il refait son
    # propre checkout + install depuis le cache npm distant.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: |
      needs.build.result == 'success' &&
      needs.build.outputs.is-dependabot-actions != 'true'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          # EPIC-39/US2 : cle scopee par type de runner. `actions/cache` est un
          # cache DISTANT partage par TOUS les runners du repo ; sans ce scope,
          # un node_modules produit sur l'image du VPS serait restaure tel quel
          # sur ubuntu-latest (et inversement). `runner.os` vaut "Linux" des deux
          # cotes et ne discrimine rien.
          key: ${{ runner.os }}-${{ runner.environment }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run unit tests
        env:
          JWT_SECRET: test-secret-key-for-ci
          JWT_EXPIRES_IN: 1h
          NODE_ENV: test
          NODE_OPTIONS: --max-old-space-size=2048
        run: npm run test -- --coverage --maxWorkers=2

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 1

  # Slow job: NestJS E2E tests (supertest against a real Postgres).
  # Triggers: push to main, tag, PR approval, /run-e2e comment on PR, or workflow_dispatch.
  # NOT triggered on every PR push to keep pipelines fast.
  # NOT triggered for Dependabot action bumps or dev dep bumps.
  # Note: github.event.comment.body is used only in if: expression context (not in run:) - safe.
  test-e2e:
    # EPIC-39/US2 : RESTE self-hosted. Le job s'appuie sur la topologie docker
    # du VPS (rattachement du conteneur runner au reseau `github_network_*` du
    # service Postgres, cf. step "Resolve postgres host") et sur la puissance
    # CPU/IO du VPS pour la suite supertest complete.
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 25
    needs: build
    if: |
      needs.build.outputs.is-dependabot-actions != 'true' &&
      needs.build.outputs.is-dependabot-dev != 'true' &&
      (
        (github.event_name == 'push') ||
        (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.body == '/run-e2e') ||
        (github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        # See test-unit for topology explanation. Runner is connected to github_network_* in Resolve step.
        ports:
          - 5432

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve postgres host
        # See test-unit for full topology explanation and root cause analysis.
        # Fix: use direct IP from docker inspect instead of DNS alias "postgres".
        id: pg-host
        run: |
          RUNNER_ID=$(hostname)
          # Sur le runner self-hosted, plusieurs networks `github_network_*`
          # peuvent coexister (orphelins de jobs precedents pas nettoyes ou
          # jobs paralleles). Le `head -1` naif pouvait pointer sur un network
          # orphelin sans postgres (cf. run 25426436114). On itere et on garde
          # celui qui contient effectivement un container postgres.
          # On retry car le tag de network du service postgres peut etre propage
          # avec un delai apres `Starting postgres service container`.
          PG_NETWORK=""
          PG_CONTAINER=""
          for attempt in 1 2 3 4 5 6 7 8; do
            for net in $(docker network ls --format '{{.Name}}' | grep '^github_network_'); do
              c=$(docker ps --filter "network=${net}" --format '{{.ID}}\t{{.Image}}' | grep -i 'postgres' | awk '{print $1}' | head -1)
              if [ -n "$c" ]; then
                PG_NETWORK="$net"
                PG_CONTAINER="$c"
                break
              fi
            done
            if [ -n "$PG_CONTAINER" ]; then
              echo "Postgres resolved on attempt ${attempt}: container=${PG_CONTAINER} network=${PG_NETWORK}"
              break
            fi
            echo "[${attempt}/8] Postgres container not yet visible on any github_network_*, retry in 3s..."
            sleep 3
          done
          if [ -z "$PG_CONTAINER" ]; then
            echo "ERROR: No postgres container found on any github_network_* after 8 attempts" >&2
            echo "--- docker network ls ---" >&2
            docker network ls >&2 || true
            echo "--- docker ps --all ---" >&2
            docker ps --all >&2 || true
            exit 1
          fi
          PG_IP=$(docker inspect "${PG_CONTAINER}" \
            --format "{{(index .NetworkSettings.Networks \"${PG_NETWORK}\").IPAddress}}")
          echo "Postgres container IP on ${PG_NETWORK}: ${PG_IP}"
          CONNECT_OUT=$(docker network connect "${PG_NETWORK}" "${RUNNER_ID}" 2>&1) && CONNECT_RC=0 || CONNECT_RC=$?
          if [ $CONNECT_RC -eq 0 ]; then
            echo "Runner container connected to ${PG_NETWORK}"
          elif echo "$CONNECT_OUT" | grep -q "already exists in network"; then
            echo "Runner container already connected (re-run)"
          else
            echo "Network connect failed (native runner?): ${CONNECT_OUT}"
            PG_HOST_PORT=$(docker inspect "${PG_CONTAINER}" \
              --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}')
            echo "PGHOST=localhost" >> $GITHUB_OUTPUT
            echo "PGPORT=${PG_HOST_PORT}" >> $GITHUB_OUTPUT
            echo "Postgres reachable at localhost:${PG_HOST_PORT}"
            exit 0
          fi
          echo "PGHOST=${PG_IP}" >> $GITHUB_OUTPUT
          echo "PGPORT=5432" >> $GITHUB_OUTPUT
          echo "DATABASE_URL will use ${PG_IP}:5432 (direct IP, no DNS)"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          # EPIC-39/US2 : cle scopee par type de runner. `actions/cache` est un
          # cache DISTANT partage par TOUS les runners du repo ; sans ce scope,
          # un node_modules produit sur l'image du VPS serait restaure tel quel
          # sur ubuntu-latest (et inversement). `runner.os` vaut "Linux" des deux
          # cotes et ne discrimine rien.
          key: ${{ runner.os }}-${{ runner.environment }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma migrations
        env:
          DATABASE_URL: postgresql://testuser:testpass@${{ steps.pg-host.outputs.PGHOST }}:${{ steps.pg-host.outputs.PGPORT }}/testdb
        run: npx prisma migrate deploy

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://testuser:testpass@${{ steps.pg-host.outputs.PGHOST }}:${{ steps.pg-host.outputs.PGPORT }}/testdb
          JWT_SECRET: test-secret-key-for-ci
          JWT_EXPIRES_IN: 1h
          NODE_ENV: test
          NODE_OPTIONS: --max-old-space-size=2048
        # --runInBand : execute les specs e2e en serie pour eviter de saturer
        # la limite de connexions Postgres (default 100). Avec ~10 specs en
        # parallele x N workers x pool size Prisma, on hit "sorry, too many
        # clients already" (cf. run #25426880283). Les e2e partagent une DB,
        # le parallelisme apporte peu et cause des collisions de fixtures.
        run: npm run test:e2e -- --runInBand

  # Mutation testing with Stryker Mutator
  # Triggers: push to main, PR approval, /run-mutation comment, workflow_dispatch.
  # NOT triggered for Dependabot PRs (no new application code to mutate).
  # Non-blocking — reports mutation score as artifact.
  mutation-test:
    # EPIC-39/US2 : Stryker n'a besoin que de Node + un Postgres jetable.
    # Rien de specifique au VPS -> GitHub-hosted. C'est aussi l'un des jobs
    # les plus longs du pipeline : le laisser sur self-hosted monopolisait un
    # des 2 runners partages pendant de longues minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    if: |
      needs.build.outputs.is-dependabot-actions != 'true' &&
      needs.build.outputs.is-dependabot-dev != 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.body == '/run-mutation') ||
        (github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        # EPIC-39/US2 : port fixe mappe sur l'hote. Sur un runner GitHub-hosted
        # le job tourne directement sur la VM (pas dans un conteneur) : l'alias
        # DNS `postgres` n'existe pas, mais le port publie est joignable sur
        # localhost. Un mapping fixe evite toute resolution dynamique.
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch main branch for incremental analysis
        if: github.ref != 'refs/heads/main'
        run: git fetch origin main:refs/remotes/origin/main --depth=1

      - name: Resolve postgres host
        # EPIC-39/US2 : ce job tournait sur self-hosted, ou le runner est
        # lui-meme un conteneur et devait etre rattache au reseau
        # `github_network_*` du service Postgres (~60 lignes de docker inspect /
        # network connect avec retries). Sur ubuntu-latest le job s'execute sur
        # la VM hote : le service est simplement publie sur localhost:5432.
        # On conserve l'id `pg-host` et ses outputs pour ne pas toucher aux
        # steps aval (migrations + stryker) qui les consomment.
        id: pg-host
        run: |
          set -euo pipefail
          echo "PGHOST=localhost" >> $GITHUB_OUTPUT
          echo "PGPORT=5432" >> $GITHUB_OUTPUT
          echo "Postgres (service container GitHub-hosted) joignable sur localhost:5432"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          # EPIC-39/US2 : cle scopee par type de runner. `actions/cache` est un
          # cache DISTANT partage par TOUS les runners du repo ; sans ce scope,
          # un node_modules produit sur l'image du VPS serait restaure tel quel
          # sur ubuntu-latest (et inversement). `runner.os` vaut "Linux" des deux
          # cotes et ne discrimine rien.
          key: ${{ runner.os }}-${{ runner.environment }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma migrations
        env:
          DATABASE_URL: postgresql://testuser:testpass@${{ steps.pg-host.outputs.PGHOST }}:${{ steps.pg-host.outputs.PGPORT }}/testdb
        run: npx prisma migrate deploy

      - name: Determine Stryker mode
        id: stryker-mode
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "args=" >> $GITHUB_OUTPUT
            echo "Running full mutation analysis"
          else
            echo "args=--since origin/main" >> $GITHUB_OUTPUT
            echo "Running incremental mutation analysis (changed files only)"
          fi

      - name: Run mutation tests
        env:
          DATABASE_URL: postgresql://testuser:testpass@${{ steps.pg-host.outputs.PGHOST }}:${{ steps.pg-host.outputs.PGPORT }}/testdb
          JWT_SECRET: test-secret-key-for-ci
          JWT_EXPIRES_IN: 1h
          NODE_ENV: test
        run: npx stryker run ${{ steps.stryker-mode.outputs.args }}
        continue-on-error: true

      - name: Upload Stryker report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stryker-mutation-report
          path: reports/mutation/
          retention-days: 7

      - name: Write Stryker summary to GitHub Step Summary
        if: always()
        run: |
          {
            echo "## 🧬 Mutation testing (Stryker)"
            echo ""
            if [[ -f reports/mutation/mutation.json ]]; then
              # Extract score from report (Stryker JSON format)
              SCORE=$(node -e "const r=require('./reports/mutation/mutation.json'); console.log(r.thresholds ? r.thresholds.high : 'n/a')" 2>/dev/null || echo "n/a")
              KILLED=$(node -e "const r=require('./reports/mutation/mutation.json'); const f=Object.values(r.files || {}); console.log(f.reduce((a,x)=>a+(x.mutants?.filter(m=>m.status==='Killed').length||0),0))" 2>/dev/null || echo "n/a")
              SURVIVED=$(node -e "const r=require('./reports/mutation/mutation.json'); const f=Object.values(r.files || {}); console.log(f.reduce((a,x)=>a+(x.mutants?.filter(m=>m.status==='Survived').length||0),0))" 2>/dev/null || echo "n/a")
              echo "- Mutation score threshold (high): **${SCORE}%**"
              echo "- Mutants killed : ${KILLED}"
              echo "- Mutants survived : ${SURVIVED}"
            else
              echo "_No mutation report found (mutation.json missing)._"
            fi
            echo ""
            echo "Full HTML report : artifact \`stryker-mutation-report\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Note: schema drift validation (formerly `validate-migrations` job, then an
  # inline step in `test-unit`) is now handled by the Husky pre-push hook on
  # backend/prisma/* changes. test-unit no longer spins up a postgres service
  # because all unit tests mock PrismaService and need no real DB connection.

  semgrep:
    # EPIC-39/US2 : le SAST n'analyse que des sources checkoutees, aucun besoin
    # du VPS. Bascule sur GitHub-hosted (le repo frontend y est deja).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    # SAST: main/tag/dispatch only — saves ~3 min per PR push.
    # Never runs for Dependabot (no new application code to scan).
    if: |
      (github.actor != 'dependabot[bot]') &&
      needs.build.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read

    # Historique : sur le runner self-hosted, `container: semgrep/semgrep:latest`
    # faisait planter le "Post job cleanup" de actions/checkout
    #   exec: "/__e/node20_alpine/bin/node": no such file or directory
    # (le runner ne montait pas son bundle node20_alpine dans le container
    # alpine). D'ou ce `docker run` explicite : aucune action GitHub ne
    # s'execute dans le container.
    # Depuis EPIC-39/US2 le job tourne sur ubuntu-latest, ou `container:` serait
    # egalement possible (c'est la forme retenue cote frontend). On conserve
    # neanmoins le `docker run` : il fonctionne a l'identique sur GitHub-hosted,
    # isole totalement semgrep du runner, et evite d'ajouter un changement de
    # forme non necessaire au perimetre de cette US.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run Semgrep (containerized CLI)
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            -e SEMGREP_APP_TOKEN \
            semgrep/semgrep:latest \
            semgrep ci

  # SonarQube analysis — BLOCKING. Quality Gate (Sonar way) must pass.
  # Runs after unit tests to include coverage from the test-unit artifact.
  # Triggers: push/PR/workflow_dispatch (same gates as the rest of the pipeline).
  # Skipped for Dependabot github_actions bumps (no application code changed).
  # QG conditions (on New Code): 0 new issues, >=80% new coverage,
  # <=3% new duplicated lines, 100% new security hotspots reviewed.
  # See docs/SONARQUBE.md for details.
  sonarqube:
    # EPIC-39/US2 : le job telecharge l'artifact de coverage et pousse l'analyse
    # vers https://sonarqube.tellebma.fr, expose publiquement via Traefik — il
    # n'a donc besoin ni du daemon Docker du VPS ni de son reseau interne.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, test-unit]
    if: |
      needs.build.outputs.is-dependabot-actions != 'true' &&
      needs.build.result == 'success' &&
      needs.test-unit.result == 'success' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'pull_request' ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # fetch-depth: 0 is required for SonarQube blame analysis and branch detection
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-lcov
          path: coverage/

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DVG }}
          SONAR_HOST_URL: https://sonarqube.tellebma.fr

      - name: Check SonarQube Quality Gate
        id: sonar-qg
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DVG }}
          SONAR_HOST_URL: https://sonarqube.tellebma.fr

      # Diagnostic : dump des conditions Quality Gate sur echec.
      # Aide a identifier la metrique bloquante sans acces a l'UI Sonar.
      - name: Dump SonarQube Quality Gate conditions on failure
        if: failure() && steps.sonar-qg.conclusion == 'failure'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DVG }}
          SONAR_HOST_URL: https://sonarqube.tellebma.fr
        run: |
          PR_KEY="${{ github.event.pull_request.number }}"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          BASE="${SONAR_HOST_URL%/}"

          echo "::group::Sonar diagnostic"
          echo "PR_KEY=$PR_KEY"
          echo "BRANCH=$BRANCH"

          if [ -n "$PR_KEY" ]; then
            URL_PR="$BASE/api/qualitygates/project_status?projectKey=dvg-backend&pullRequest=$PR_KEY"
            echo "--- PR query: $URL_PR"
            curl -sS -u "$SONAR_TOKEN:" -w "\nHTTP %{http_code}\n" "$URL_PR" | head -200
          fi

          URL_BR="$BASE/api/qualitygates/project_status?projectKey=dvg-backend&branch=$BRANCH"
          echo "--- Branch query: $URL_BR"
          curl -sS -u "$SONAR_TOKEN:" -w "\nHTTP %{http_code}\n" "$URL_BR" | head -200

          URL_MAIN="$BASE/api/qualitygates/project_status?projectKey=dvg-backend"
          echo "--- Main query: $URL_MAIN"
          curl -sS -u "$SONAR_TOKEN:" -w "\nHTTP %{http_code}\n" "$URL_MAIN" | head -200

          URL_ISSUES="$BASE/api/issues/search?componentKeys=dvg-backend&inNewCodePeriod=true&types=CODE_SMELL,BUG,VULNERABILITY&ps=50"
          echo "--- New issues: $URL_ISSUES"
          curl -sS -u "$SONAR_TOKEN:" "$URL_ISSUES" -o /tmp/issues.json && \
            python3 -c "import json; d=json.load(open('/tmp/issues.json')); print(json.dumps([{'severity':i.get('severity'),'rule':i.get('rule'),'component':i.get('component'),'line':i.get('line'),'message':i.get('message')} for i in d.get('issues',[])], indent=2))" 2>&1 | head -200

          URL_HOTSPOTS="$BASE/api/hotspots/search?projectKey=dvg-backend&status=TO_REVIEW&ps=50"
          echo "--- Security hotspots: $URL_HOTSPOTS"
          curl -sS -u "$SONAR_TOKEN:" "$URL_HOTSPOTS" -o /tmp/hotspots.json && \
            python3 -c "import json; d=json.load(open('/tmp/hotspots.json')); print(json.dumps([{'rule':i.get('ruleKey'),'component':i.get('component'),'line':i.get('line'),'message':i.get('message')} for i in d.get('hotspots',[])], indent=2))" 2>&1 | head -200

          echo "::endgroup::"

  # ═════════════════════════════════════════════════════════════════════════
  # REPRISE — image :RELEASE absente de GHCR (EPIC-39 / US3)
  # ═════════════════════════════════════════════════════════════════════════
  # Incident du 2026-07-22 : `ghcr-cleanup.yml` a supprime l'image :RELEASE de
  # production (le garde-fou `ignore-versions` filtrait le digest sha256, jamais
  # le tag — il etait inoperant depuis le debut). Resultat : `docker pull` en 404
  # cote Ansible, tout deploiement casse, et AUCUN chemin GitHub Actions capable
  # de reconstruire l'image. Il a fallu se connecter en SSH au VPS pour
  # re-pousser l'image encore presente dans le cache local du daemon.
  #
  # Pourquoi le chemin de secours existant ne suffisait pas : `workflow_dispatch`
  # + `deploy_tag` saute volontairement le rebuild (« l'image :RELEASE existe
  # deja sur GHCR ») et le step « Verify RELEASE image exists on GHCR » faisait
  # meme `exit 1` si elle etait absente — donc inutilisable precisement dans ce
  # cas la.
  #
  # Ce job comble le trou : sur le chemin dispatch, il verifie la presence du tag
  # IMMUABLE X.Y.Z-RELEASE sur GHCR et, s'il manque, RECONSTRUIT l'image depuis
  # les sources du tag puis la republie. Si l'image est presente, il ne fait
  # rien : le comportement historique (pas de rebuild inutile) est preserve.
  #
  # Immutabilite : on ne rebuild QUE quand l'image est absente — il n'y a donc
  # rien a ecraser, la garantie d'immutabilite du tag X.Y.Z-RELEASE n'est pas
  # violee. En revanche l'image reconstruite peut differer de l'originale si les
  # images de base ont bouge depuis ; c'est le compromis assume d'un chemin de
  # reprise apres sinistre.
  #
  # runs-on: ubuntu-latest — VOLONTAIRE. C'est un chemin de reprise apres
  # sinistre : il ne doit pas dependre des runners self-hosted, dont
  # l'indisponibilite est justement l'autre incident du 2026-07-22.
  #
  # ─────────────────────────────────────────────────────────────────────────
  # AUTRE CHEMIN DE REPRISE (a privilegier quand le tag existe cote git) :
  #
  #     gh workflow run cicd.yml --ref vX.Y.Z
  #
  # Rejoue le pipeline complet sur le tag : `determine-tags.sh` detecte
  # `refs/tags/v*` -> TAG_SUFFIX=RELEASE, l'image est rebuildee, scannee,
  # smoke-testee puis deployee en PROD. C'est la seule commande qui reconstruit
  # reellement :RELEASE de bout en bout.
  # ─────────────────────────────────────────────────────────────────────────
  release-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_tag != ''
    permissions:
      contents: read
      packages: write
    outputs:
      # 'true' si l'image etait absente et vient d'etre reconstruite.
      # Consomme par smoke-release pour forcer un vrai boot de l'image
      # (une image fraichement rebuildee n'a jamais ete smoke-testee).
      rebuilt: ${{ steps.check.outputs.rebuilt }}
      release-image: ${{ steps.check.outputs.release-image }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the RELEASE image still exists on GHCR
        id: check
        env:
          DEPLOY_TAG: ${{ inputs.deploy_tag }}
          # Defensif : `docker manifest` etait une commande CLI experimentale
          # avant Docker 23. Sans effet sur les CLI recentes.
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          set -euo pipefail
          # On cible le tag IMMUABLE versionne X.Y.Z-RELEASE (et non le tag
          # flottant :RELEASE) : c'est lui qui identifie sans ambiguite la
          # version demandee via deploy_tag.
          VERSION="${DEPLOY_TAG#v}"
          IMAGE_BASE="ghcr.io/teamdivergentes/website_backend/dvg_web_backend"
          RELEASE_IMAGE="${IMAGE_BASE}:${VERSION}-RELEASE"
          echo "image-base=$IMAGE_BASE" >> "$GITHUB_OUTPUT"
          echo "release-image=$RELEASE_IMAGE" >> "$GITHUB_OUTPUT"

          if docker manifest inspect "$RELEASE_IMAGE" > /dev/null 2>&1; then
            echo "rebuilt=false" >> "$GITHUB_OUTPUT"
            echo "Image $RELEASE_IMAGE presente sur GHCR — aucun rebuild necessaire."
          else
            echo "rebuilt=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Image $RELEASE_IMAGE ABSENTE de GHCR — reconstruction depuis les sources du tag ${DEPLOY_TAG}."
          fi

      - name: Checkout release tag sources
        # On checkoute le TAG, pas la branche depuis laquelle le dispatch a ete
        # lance : rebuilder le HEAD courant produirait une image au contenu
        # different de ce que le tag a livre, tout en la publiant sous le tag
        # X.Y.Z-RELEASE. Si le tag n'existe pas, ce step echoue explicitement.
        if: steps.check.outputs.rebuilt == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.deploy_tag }}

      - name: Resolve tag commit SHA
        id: src
        if: steps.check.outputs.rebuilt == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.check.outputs.rebuilt == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Rebuild and push the missing RELEASE image
        if: steps.check.outputs.rebuilt == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          # Trois tags, alignes sur ce que le run du tag original aurait publie :
          #   - X.Y.Z-RELEASE : tag immuable, celui que deploy-prod deploiera
          #   - :RELEASE      : tag flottant, celui qu'Ansible pull par defaut —
          #                     c'est sa disparition qui a casse la prod. Le
          #                     repositionner ici est coherent : a la fin de ce
          #                     run, la PROD tournera bien sur cette version.
          #   - :<sha du tag> : SHA du commit REELLEMENT construit (pas
          #                     github.sha, qui pointe sur la branche du dispatch)
          tags: |
            ${{ steps.check.outputs.release-image }}
            ${{ steps.check.outputs.image-base }}:RELEASE
            ${{ steps.check.outputs.image-base }}:${{ steps.src.outputs.sha }}
          cache-from: type=registry,ref=${{ steps.check.outputs.image-base }}:buildcache

      - name: Summary
        if: always()
        env:
          DEPLOY_TAG: ${{ inputs.deploy_tag }}
          REBUILT: ${{ steps.check.outputs.rebuilt }}
          RELEASE_IMAGE: ${{ steps.check.outputs.release-image }}
        run: |
          {
            echo "## Reprise image :RELEASE (EPIC-39/US3)"
            echo ""
            echo "- Tag demande : \`${DEPLOY_TAG}\`"
            echo "- Image ciblee : \`${RELEASE_IMAGE}\`"
            if [[ "$REBUILT" == "true" ]]; then
              echo "- Image absente de GHCR -> **reconstruite depuis les sources du tag** et republiee."
              echo "- Elle sera smoke-testee par \`smoke-release\` avant tout deploiement PROD."
            else
              echo "- Image presente sur GHCR -> **aucun rebuild** (comportement nominal preserve)."
            fi
            echo ""
            echo "Alternative de reprise complete : \`gh workflow run cicd.yml --ref ${DEPLOY_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Docker depends on fast jobs only (test-unit, not test-e2e) plus the Sonar QG.
  # Sonar QG blocks Docker build -> no image is published if quality fails.
  # Skipped for Dependabot dev-dep and action bumps (no production code changed).
  #
  # DISPATCH FALLBACK PROD : quand workflow_dispatch est déclenché avec deploy_tag
  # renseigné, le rebuild est sauté (l'image :RELEASE existe déjà sur GHCR, au
  # besoin restauree juste avant par le job `release-rebuild` — cf. EPIC-39/US3).
  # Ce job tourne quand même pour fournir les outputs (image-tag, image-name…)
  # dont smoke-release et deploy-prod ont besoin. Seul le step build-push est conditionné.
  docker:
    # EPIC-39/US2 : RESTE self-hosted. Le build image beneficie du cache buildx
    # local au daemon du VPS (layers deja presentes), et l'image produite est
    # ensuite consommee localement par scan-image et smoke-release sur le meme
    # daemon. Basculer ce job perdrait le cache et allongerait fortement le build.
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 40
    # EPIC-39/US3 : `release-rebuild` est ajoute aux `needs` uniquement pour
    # ordonnancer — il doit avoir termine (restauration eventuelle de l'image)
    # AVANT que le step de verification GHCR de ce job ne s'execute, sinon on
    # aurait une course. Il est `skipped` sur tous les chemins hors dispatch.
    needs: [build, lint, test-unit, semgrep, sonarqube, release-rebuild]
    if: |
      !cancelled() &&
      needs.build.outputs.is-dependabot-actions != 'true' &&
      needs.build.outputs.is-dependabot-dev != 'true' &&
      needs.build.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test-unit.result == 'success' &&
      (needs.semgrep.result == 'success' || needs.semgrep.result == 'skipped') &&
      (needs.sonarqube.result == 'success' || needs.sonarqube.result == 'skipped') &&
      (needs.release-rebuild.result == 'success' || needs.release-rebuild.result == 'skipped')
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tags.outputs.image-tag }}
      workflow-tag: ${{ steps.tags.outputs.workflow-tag }}
      version-tag: ${{ steps.tags.outputs.version-tag }}
      tag-suffix: ${{ steps.tags.outputs.tag-suffix }}
      image-name: ${{ steps.tags.outputs.image-name }}
      deploy-tag: ${{ steps.tags.outputs.deploy-tag }}
      image-digest: ${{ steps.build-image.outputs.digest }}
      docker-status: ${{ job.status }}
    env:
      BUILD_STATUS: ${{ needs.build.result }}
      LINT_STATUS: ${{ needs.lint.result }}
      TEST_STATUS: ${{ needs.test-unit.result }}
      SEMGREP_STATUS: ${{ needs.semgrep.result }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_HEAD_REF: ${{ github.head_ref || github.ref_name }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Determine image tags
        id: tags
        # Sur dispatch fallback (deploy_tag renseigné), on injecte DISPATCH_DEPLOY_TAG
        # pour que determine-tags.sh produise TAG_SUFFIX=RELEASE / image :RELEASE
        # sans reconstruire depuis la branche courante (GITHUB_REF = refs/heads/...).
        env:
          DISPATCH_DEPLOY_TAG: ${{ inputs.deploy_tag || '' }}
        run: |
          chmod +x ./.github/scripts/determine-tags.sh
          ./.github/scripts/determine-tags.sh

      - name: Update Dockerfile with build labels
        id: labels
        run: |
          chmod +x ./.github/scripts/update-dockerfile-labels.sh
          ./.github/scripts/update-dockerfile-labels.sh \
            "${{ steps.tags.outputs.image-tag }}" \
            "${{ steps.tags.outputs.workflow-tag }}" \
            "${{ steps.tags.outputs.tag-suffix }}" \
            "${{ env.BUILD_STATUS }}" \
            "${{ env.LINT_STATUS }}" \
            "${{ env.TEST_STATUS }}" \
            "${{ env.SEMGREP_STATUS }}" \
            "${{ env.GITHUB_SHA }}" \
            "${{ env.GITHUB_HEAD_REF }}" \
            "${{ env.GITHUB_ACTOR }}" \
            "${{ env.BUILD_TIME }}" \
            "${{ env.GITHUB_REPOSITORY }}"

          # Extraire les labels du Dockerfile pour les passer a docker/build-push-action
          if [[ -f "Dockerfile" ]]; then
            grep "^LABEL " Dockerfile | sed 's/^LABEL //' > labels_temp.txt

            if [[ -s "labels_temp.txt" ]]; then
              while IFS= read -r line; do
                if [[ "$line" =~ [\;\|\&\`\$\(\)] ]]; then
                  echo "Warning: Label dangereux detecte et ignore: $line"
                  continue
                fi
                echo "$line" >> labels_output.txt
              done < labels_temp.txt

              if [[ -f "labels_output.txt" && -s "labels_output.txt" ]]; then
                echo "labels<<EOF" >> $GITHUB_OUTPUT
                cat labels_output.txt >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT
              else
                echo "Warning: Aucun label valide trouve dans le Dockerfile"
              fi
            else
              echo "Warning: Aucun label trouve dans le Dockerfile"
            fi

            rm -f labels_temp.txt labels_output.txt
          else
            echo "Dockerfile non trouve"
            exit 1
          fi
        env:
          BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.repository.pushed_at || github.event.repository.updated_at }}

      # DISPATCH FALLBACK PROD : on ne rebuilde PAS l'image ici — elle existe déjà
      # sur GHCR, ou vient d'y etre restauree par le job `release-rebuild`
      # (EPIC-39/US3, incident du 2026-07-22 : image :RELEASE supprimee par le
      # cleanup GHCR, aucune reprise possible depuis GitHub Actions).
      # On vérifie que le tag IMMUABLE versionné X.Y.Z-RELEASE est bien présent.
      # On cible version-tag (ex: 1.5.0-RELEASE) et non workflow-tag (:RELEASE flottant)
      # pour garantir qu'on redeploie EXACTEMENT le tag demandé et non la dernière release
      # publiée depuis (ex: v1.4.1 demandé mais :RELEASE pointe sur v1.5.0 → mauvaise version).
      # Ce step reste un garde-fou : il ne devrait plus echouer que si
      # `release-rebuild` n'a pas pu reconstruire l'image (tag git inexistant,
      # build casse). Le message oriente alors vers la reprise complete.
      - name: Verify RELEASE image exists on GHCR (dispatch fallback only)
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_tag != ''
        env:
          IMAGE_TAG: ${{ steps.tags.outputs.image-tag }}
          VERSION_TAG: ${{ steps.tags.outputs.version-tag }}
          REBUILT: ${{ needs.release-rebuild.outputs.rebuilt }}
        run: |
          set -euo pipefail
          echo "Dispatch fallback : verification des images GHCR avant deploy..."
          echo "  SHA tag      : $IMAGE_TAG"
          echo "  Version tag  : $VERSION_TAG"
          if [[ "$REBUILT" == "true" ]]; then
            echo "  Image reconstruite par le job release-rebuild (elle etait absente de GHCR)."
          fi
          # Tenter de pull le manifest sans télécharger les layers
          docker manifest inspect "$VERSION_TAG" > /dev/null 2>&1 || {
            echo "::error::Image $VERSION_TAG toujours introuvable sur GHCR apres le job release-rebuild."
            echo "::error::Causes possibles : le tag ${{ inputs.deploy_tag }} n'existe pas cote git"
            echo "::error::(tag fantome, jamais cree), ou la reconstruction a echoue."
            echo "::error::Reprise complete depuis un tag existant :"
            echo "::error::    gh workflow run cicd.yml --ref ${{ inputs.deploy_tag }}"
            echo "::error::Sinon, promouvoir develop->main pour creer un nouveau tag."
            exit 1
          }
          echo "Image $VERSION_TAG presente sur GHCR - OK"

      - name: Build and Push Docker image
        id: build-image
        # Sur dispatch fallback (deploy_tag renseigné), l'image est déjà sur GHCR — on skip.
        if: "!(github.event_name == 'workflow_dispatch' && inputs.deploy_tag != '')"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # platforms: linux/amd64,linux/arm64  # Multi-arch desactive : serveur cible amd64 uniquement
          platforms: linux/amd64
          tags: |
            ${{ steps.tags.outputs.image-tag }}
            ${{ steps.tags.outputs.workflow-tag }}
            ${{ steps.tags.outputs.version-tag }}
          labels: ${{ steps.labels.outputs.labels }}
          # Cache : sur le runner self-hosted, le backend cache GHA (type=gha)
          # renvoie regulierement des HTTP 400 et declenche des retries qui
          # font durer le build 30+ min. On utilise type=registry (cache pousse
          # dans GHCR sous un tag dedie) qui ne depend pas du backend GHA
          # interne et profite a tous les runners.
          cache-from: type=registry,ref=${{ steps.tags.outputs.image-name }}:buildcache
          cache-to: ${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.pull_request.title || '', '[DEPLOY]')) && format('type=registry,ref={0}:buildcache,mode=max', steps.tags.outputs.image-name) || '' }}

  scan-image:
    # EPIC-39/US2 : RESTE self-hosted. Trivy scanne l'image qui vient d'etre
    # buildee sur ce meme daemon Docker : la scanner ailleurs imposerait un
    # pull complet depuis GHCR a chaque run.
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 25
    needs: [docker]
    if: ${{ !cancelled() && needs.docker.result == 'success' }}
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SECURITY: Trivy was compromised in a supply chain attack (March 2026).
      # Only SHA 57a97c7 (v0.35.0) is verified safe. Do NOT update without verification.
      # See: https://github.com/aquasecurity/trivy/security/advisories/GHSA-69fq-xp46-6x23
      #
      # Informational scan — table output visible in job logs. Steps are
      # non-blocking : `exit-code: 0` neutralise les findings, et
      # `continue-on-error: true` evite qu'un crash interne de Trivy
      # (DB schema obsolete, network, registry) bloque la chaine de deploy.
      # La detection reelle des CVE reste en place (visible dans les logs et
      # dans l'onglet Security quand l'upload SARIF reussit).
      - name: Run Trivy vulnerability scanner (table)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (verified safe)
        continue-on-error: true
        with:
          image-ref: ${{ needs.docker.outputs.image-tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      # SARIF report for GitHub Security tab
      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (verified safe)
        continue-on-error: true
        with:
          image-ref: ${{ needs.docker.outputs.image-tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

  # Deploiement PREPROD (push sur develop ou PR avec [DEPLOY]).
  # GitFlow refonte : PREPROD est branchee sur develop pour valider en
  # continu chaque integration. Un merge sur main ne deploie plus PREPROD ;
  # il declenche uniquement la creation du tag vX.Y.Z qui partira en PROD
  # apres smoke-release (cf. job du meme nom).
  deploy-preprod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, lint, test-unit, semgrep, docker, scan-image]
    if: |
      !cancelled() &&
      (github.ref == 'refs/heads/develop' ||
       (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[DEPLOY]'))) &&
      needs.build.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test-unit.result == 'success' &&
      (needs.semgrep.result == 'success' || needs.semgrep.result == 'skipped') &&
      needs.docker.result == 'success' &&
      needs.scan-image.result == 'success'
    environment:
      name: preprod
      url: https://preprod-api.teamdivergentes.fr
    permissions:
      contents: read
    outputs:
      deploy-status: ${{ steps.set-status.outputs.deploy-status }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Deploy to PREPROD
        id: deploy
        env:
          DEPLOY_REPO: ${{ secrets.DEPLOY_REPO }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          IMAGE_REPO: ${{ needs.docker.outputs.image-name }}
          DEPLOY_IMAGE_TAG: ${{ needs.docker.outputs.image-tag }}
        run: |
          chmod +x ./.github/scripts/deploy.sh
          ./.github/scripts/deploy.sh "PREPROD" "website"

      - name: Set deployment status
        id: set-status
        if: always()
        run: echo "deploy-status=${{ steps.deploy.outcome }}" >> $GITHUB_OUTPUT

  # Smoke-release : valide le binaire :RELEASE avant deploiement PROD.
  # Chemin normal (tag push) : boot l'image localement avec Postgres service,
  #   applique les migrations, verifie /health → 200. Garde-fou final.
  # Chemin dispatch fallback (workflow_dispatch + deploy_tag) : l'image a deja
  #   ete validee lors du tag initial. On verifie uniquement le manifest GHCR
  #   (fait dans le job docker) et on passe directement a deploy-prod.
  #   Le boot local Postgres n'est PAS rejoue : le service postgres n'est declare
  #   que pour ne pas bloquer si le runner l'ignore quand le step est skippe.
  # Chemin dispatch AVEC reconstruction (EPIC-39/US3) : si `release-rebuild` a du
  #   reconstruire l'image parce qu'elle avait disparu de GHCR, l'hypothese
  #   « image deja validee lors du tag initial » ne tient plus — ce binaire n'a
  #   jamais ete smoke-teste. On rejoue donc le boot complet, exactement comme
  #   sur le chemin normal, avant de laisser deploy-prod toucher la production.
  smoke-release:
    # EPIC-39/US2 : RESTE self-hosted. Le smoke boote l'image release dans le
    # daemon Docker du VPS et la fait dialoguer avec le service Postgres via le
    # reseau `github_network_*` — meme topologie que test-e2e.
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 15
    needs: [docker, scan-image, release-rebuild]
    if: |
      !cancelled() &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.deploy_tag != '')) &&
      needs.docker.result == 'success' &&
      (needs.scan-image.result == 'success' || needs.scan-image.result == 'skipped') &&
      (needs.release-rebuild.result == 'success' || needs.release-rebuild.result == 'skipped')
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smokeuser
          POSTGRES_PASSWORD: smokepass
          POSTGRES_DB: smokedb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432

    steps:
      # Ce step s'execute sur le chemin normal (tag push) ET sur le chemin
      # dispatch quand l'image a du etre reconstruite (EPIC-39/US3) — dans les
      # deux cas on boot reellement l'image et il faut joindre Postgres.
      # Sur dispatch SANS reconstruction, le service postgres reste declare
      # (nécessaire pour que le job reste valide) mais le step est skippe.
      - name: Resolve service network and connect runner
        id: pg-net
        if: startsWith(github.ref, 'refs/tags/v') || needs.release-rebuild.outputs.rebuilt == 'true'
        run: |
          set -euo pipefail
          RUNNER_ID=$(hostname)
          # Retry loop : le tag de network du service postgres peut etre propage
          # avec un delai apres le demarrage du service container.
          PG_NETWORK=""
          PG_CONTAINER=""
          for attempt in 1 2 3 4 5 6 7 8; do
            for net in $(docker network ls --format '{{.Name}}' | grep '^github_network_'); do
              c=$(docker ps --filter "network=${net}" --format '{{.ID}}\t{{.Image}}' | grep -i 'postgres' | awk '{print $1}' | head -1)
              if [ -n "$c" ]; then
                PG_NETWORK="$net"
                PG_CONTAINER="$c"
                break
              fi
            done
            if [ -n "$PG_CONTAINER" ]; then
              echo "Postgres resolved on attempt ${attempt}: container=${PG_CONTAINER} network=${PG_NETWORK}"
              break
            fi
            echo "[${attempt}/8] Postgres container not yet visible on any github_network_*, retry in 3s..."
            sleep 3
          done
          if [ -z "$PG_CONTAINER" ]; then
            echo "ERROR: No postgres container found on any github_network_* after 8 attempts" >&2
            docker network ls >&2 || true
            docker ps --all >&2 || true
            exit 1
          fi
          echo "Service network: ${PG_NETWORK}"
          CONNECT_OUT=$(docker network connect "${PG_NETWORK}" "${RUNNER_ID}" 2>&1) && CONNECT_RC=0 || CONNECT_RC=$?
          if [ $CONNECT_RC -eq 0 ]; then
            echo "Runner container connected to ${PG_NETWORK}"
          elif echo "$CONNECT_OUT" | grep -q "already exists in network"; then
            echo "Runner already on ${PG_NETWORK}"
          else
            # Fallback : runner en network_mode:host (hostname = VPS, pas un container ID).
            # docker network connect echoue car le runner n'est pas un container joignable
            # par nom. On utilise le port expose sur l'hote a la place.
            echo "Network connect failed (native/host-network runner): ${CONNECT_OUT}"
            echo "Falling back to host-mapped port..."
            PG_HOST_PORT=$(docker inspect "${PG_CONTAINER}" \
              --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}')
            echo "PGHOST=localhost" >> $GITHUB_OUTPUT
            echo "PGPORT=${PG_HOST_PORT}" >> $GITHUB_OUTPUT
            echo "network=" >> $GITHUB_OUTPUT
            echo "Postgres reachable at localhost:${PG_HOST_PORT}"
            exit 0
          fi
          echo "network=${PG_NETWORK}" >> $GITHUB_OUTPUT
          echo "PGHOST=postgres" >> $GITHUB_OUTPUT
          echo "PGPORT=5432" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Chemin dispatch fallback SANS reconstruction : l'image a deja ete
      # smoke-testee lors du tag initial. On confirme la presence du tag IMMUABLE
      # versionné X.Y.Z-RELEASE (double-securite, le job docker l'a deja verifie).
      # On cible version-tag et non workflow-tag (:RELEASE flottant) pour garantir
      # que l'on redéploie bien la version exacte demandée.
      # Si `release-rebuild` a reconstruit l'image (EPIC-39/US3), on saute cette
      # simple confirmation : le step de boot ci-dessous fait un vrai smoke test.
      - name: Confirm RELEASE image present (dispatch fallback)
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_tag != '' && needs.release-rebuild.outputs.rebuilt != 'true'
        env:
          VERSION_TAG: ${{ needs.docker.outputs.version-tag }}
        run: |
          set -euo pipefail
          echo "Dispatch fallback : confirmation image $VERSION_TAG..."
          docker pull "$VERSION_TAG" > /dev/null
          echo "Image $VERSION_TAG confirmee sur GHCR - smoke passe (image pre-validee)"

      # Chemin normal (tag push) : boot complet avec Postgres service.
      # Egalement joue sur le chemin dispatch quand l'image vient d'etre
      # reconstruite (EPIC-39/US3) : elle n'a alors jamais ete smoke-testee.
      - name: Pull and boot release image
        if: startsWith(github.ref, 'refs/tags/v') || needs.release-rebuild.outputs.rebuilt == 'true'
        env:
          # Sur le chemin de reconstruction, le tag SHA de `docker` (image-tag)
          # pointe sur le commit de la branche du dispatch et n'a pas ete pousse :
          # on smoke-teste le tag immuable X.Y.Z-RELEASE reellement republie.
          IMAGE: ${{ needs.release-rebuild.outputs.rebuilt == 'true' && needs.release-rebuild.outputs.release-image || needs.docker.outputs.image-tag }}
          PG_NETWORK: ${{ steps.pg-net.outputs.network }}
          PGHOST: ${{ steps.pg-net.outputs.PGHOST }}
          PGPORT: ${{ steps.pg-net.outputs.PGPORT }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          # Si PG_NETWORK est vide = fallback localhost (runner en network_mode:host).
          # On demarre le smoke avec --network host pour qu'il partage la stack reseau
          # de l'hote et puisse joindre Postgres via localhost:PGPORT.
          # Si PG_NETWORK est defini = runner container connecte au reseau de services,
          # on attach le smoke au meme reseau pour resoudre l'alias "postgres".
          if [ -z "${PG_NETWORK}" ]; then
            DB_URL="postgresql://smokeuser:smokepass@${PGHOST}:${PGPORT}/smokedb"
            docker run -d --name backend-smoke \
              --network host \
              -e NODE_ENV=production \
              -e DATABASE_URL="${DB_URL}" \
              -e JWT_SECRET=smoke-release-secret-key \
              -e JWT_EXPIRES_IN=1h \
              "$IMAGE"
            SMOKE_HOST="localhost"
          else
            DB_URL="postgresql://smokeuser:smokepass@postgres:5432/smokedb"
            docker run -d --name backend-smoke \
              --network "$PG_NETWORK" \
              -e NODE_ENV=production \
              -e DATABASE_URL="${DB_URL}" \
              -e JWT_SECRET=smoke-release-secret-key \
              -e JWT_EXPIRES_IN=1h \
              "$IMAGE"
            SMOKE_HOST="backend-smoke"
          fi
          # Boot peut prendre 20-30s (migrate deploy + bootstrap NestJS).
          # 60s laisse une marge confortable avant d'echouer.
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 "http://${SMOKE_HOST}:3000/health" || echo "0")
            if [[ "$STATUS" == "200" ]]; then
              echo "Smoke OK (HTTP 200) apres ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Smoke release KO - /health n'a jamais repondu 200 apres 60s"
          docker logs backend-smoke || true
          exit 1

      - name: Cleanup smoke container
        if: always()
        run: docker rm -f backend-smoke || true

  # Deploiement PROD (tag vX.Y.Z apres smoke-release, ou dispatch fallback).
  # Chemin normal : on passe DEPLOY_IMAGE_TAG=:SHA pour deployer le binaire EXACT
  #   qui vient d'etre smoke-teste, sans dependre du tag flottant :RELEASE.
  # Chemin dispatch fallback : DEPLOY_IMAGE_TAG = :RELEASE (image pre-validee,
  #   pas de SHA courant valide car on n'a pas rebuilde). L'image :RELEASE
  #   a ete confirmee presente par le job docker + smoke-release dispatch.
  deploy-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, lint, test-unit, semgrep, docker, scan-image, smoke-release]
    if: |
      !cancelled() &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.deploy_tag != '')) &&
      needs.build.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test-unit.result == 'success' &&
      (needs.semgrep.result == 'success' || needs.semgrep.result == 'skipped') &&
      needs.docker.result == 'success' &&
      (needs.scan-image.result == 'success' || needs.scan-image.result == 'skipped') &&
      needs.smoke-release.result == 'success'
    environment:
      name: production
      url: https://api.teamdivergentes.fr
    permissions:
      contents: read
    outputs:
      deploy-status: ${{ steps.set-status.outputs.deploy-status }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Deploy to PROD
        id: deploy-prod
        env:
          DEPLOY_REPO: ${{ secrets.DEPLOY_REPO }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          IMAGE_REPO: ${{ needs.docker.outputs.image-name }}
          # Chemin normal (tag push) : on utilise le SHA exact pour cibler le
          #   binaire smoke-teste sans dependre d'un tag flottant.
          # Chemin dispatch fallback : pas de SHA courant valide (pas de rebuild).
          #   On utilise le tag IMMUABLE versionné X.Y.Z-RELEASE (version-tag) et non
          #   le tag flottant :RELEASE (workflow-tag) pour garantir que l'on redeploie
          #   EXACTEMENT la version demandée via deploy_tag, et non la dernière release
          #   publiée depuis (ex: deploy_tag=v1.4.1 mais :RELEASE pointe sur v1.5.0).
          DEPLOY_IMAGE_TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_tag != '') && needs.docker.outputs.version-tag || needs.docker.outputs.image-tag }}
        run: |
          chmod +x ./.github/scripts/deploy.sh
          ./.github/scripts/deploy.sh "PROD" "website"

      - name: Set deployment status
        id: set-status
        if: always()
        run: echo "deploy-status=${{ steps.deploy-prod.outcome }}" >> $GITHUB_OUTPUT

  pr-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, lint, test-unit, test-e2e, semgrep, docker, scan-image, deploy-preprod, deploy-prod]
    if: |
      always() &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request != null))
    continue-on-error: true
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      BUILD_STATUS: ${{ needs.build.result }}
      LINT_STATUS: ${{ needs.lint.result }}
      TEST_STATUS: ${{ needs.test-unit.result }}
      E2E_STATUS: ${{ needs.test-e2e.result || 'skipped' }}
      SEMGREP_STATUS: ${{ needs.semgrep.result }}
      DOCKER_STATUS: ${{ needs.docker.result }}
      DEPLOY_PREPROD_STATUS: ${{ needs.deploy-preprod.result || 'skipped' }}
      DEPLOY_PROD_STATUS: ${{ needs.deploy-prod.result || 'skipped' }}
      IMAGE_TAG: ${{ needs.docker.outputs.image-tag || 'N/A' }}
      WORKFLOW_TAG: ${{ needs.docker.outputs.workflow-tag || 'N/A' }}
      VERSION_TAG: ${{ needs.docker.outputs.version-tag || 'N/A' }}
      TAG_SUFFIX: ${{ needs.docker.outputs.tag-suffix || 'N/A' }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_HEAD_REF: ${{ github.head_ref || github.ref_name }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_EVENT_NUMBER: ${{ github.event.number || github.event.issue.number }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Generer le rapport de PR
        id: report
        run: |
          chmod +x ./.github/scripts/generate-pr-report.sh
          ./.github/scripts/generate-pr-report.sh
          echo "report-generated=true" >> $GITHUB_OUTPUT

      - name: Comment PR
        run: |
          chmod +x ./.github/scripts/publish-pr-comment.cjs
          node ./.github/scripts/publish-pr-comment.cjs

  # ADD-003 : Notification Discord apres deploiement
  notify:
    if: always() && (needs.deploy-preprod.result != 'skipped' || needs.deploy-prod.result != 'skipped')
    needs: [deploy-preprod, deploy-prod]
    uses: ./.github/workflows/discord-notify.yml
    with:
      environment: ${{ needs.deploy-prod.result != 'skipped' && 'PRODUCTION' || 'PREPROD' }}
      status: ${{ needs.deploy-prod.result != 'skipped' && needs.deploy-prod.result || needs.deploy-preprod.result }}
      repository: ${{ github.repository }}
      actor: ${{ github.actor }}
      sha: ${{ github.sha }}
      url: ${{ needs.deploy-prod.result != 'skipped' && 'https://api.teamdivergentes.fr' || 'https://preprod-api.teamdivergentes.fr' }}
    secrets:
      DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}

  # Semantic Release (auto-tag sur main)
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, lint, test-unit, semgrep, docker]
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release)') &&
      needs.build.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test-unit.result == 'success' &&
      (needs.semgrep.result == 'success' || needs.semgrep.result == 'skipped') &&
      needs.docker.result == 'success'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git credentials for tag push
        run: git remote set-url origin "https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@teamdivergentes.fr
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@teamdivergentes.fr
        run: npx semantic-release

  # Garde-fou anti tag-fantôme (EPIC-24 Enabler-1).
  # Semantic-release crée le tag vX.Y.Z sur main. Ce tag DOIT déclencher un
  # nouveau run CICD (le "tag run") pour construire :RELEASE et déployer PROD.
  # Si GitHub rate-limite, le webhook tag est silencieusement droppé → le tag
  # run ne démarre jamais → :RELEASE n'est jamais poussée → deploy-prod skip.
  # Ce job attend 90s (délai GitHub pour enregistrer le run) puis interroge
  # l'API. Si aucun run récent sur ce tag n'est trouvé, on notifie Discord.
  # Non-bloquant (continue-on-error: true) : la release est créée, on informe
  # seulement.
  #
  # DEUX CHEMINS DE REPRISE possibles pour l'operateur (EPIC-39/US3) :
  #
  #   1. gh workflow run cicd.yml --ref vX.Y.Z          <- a privilegier
  #      Rejoue le pipeline COMPLET sur le tag : determine-tags.sh detecte
  #      `refs/tags/v*` -> TAG_SUFFIX=RELEASE, l'image :RELEASE est reellement
  #      (re)construite, scannee, smoke-testee puis deployee en PROD.
  #
  #   2. Actions UI -> Run workflow -> deploy_tag = vX.Y.Z
  #      Chemin de secours : ne rebuild pas si l'image X.Y.Z-RELEASE existe deja
  #      sur GHCR. Depuis EPIC-39/US3, si elle a DISPARU (incident du
  #      2026-07-22, cleanup GHCR), le job `release-rebuild` la reconstruit
  #      automatiquement depuis les sources du tag au lieu d'echouer.
  check-tag-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release]
    if: |
      needs.release.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for tag run to appear
        run: |
          echo "Attente 90s pour laisser GitHub enregistrer le run sur le tag..."
          sleep 90

      - name: Check tag run existence
        id: tag-check
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Récupérer le dernier tag créé par semantic-release (commence par v)
          LATEST_TAG=$(curl -sf \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/tags?per_page=5" \
            | jq -r '[.[] | select(.name | startswith("v"))] | .[0].name // empty')

          if [[ -z "$LATEST_TAG" ]]; then
            echo "Impossible de recuperer le dernier tag — check abandonne"
            echo "tag-found=unknown" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Dernier tag : $LATEST_TAG"
          echo "tag-name=$LATEST_TAG" >> $GITHUB_OUTPUT

          # Lister les runs CICD sur ce tag (creés dans les 5 dernières minutes)
          SINCE=$(date -u -d '5 minutes ago' +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || \
                  date -u -v-5M +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || \
                  echo "")
          QUERY="https://api.github.com/repos/$REPO/actions/workflows/cicd.yml/runs?branch=${LATEST_TAG}&per_page=5"
          if [[ -n "$SINCE" ]]; then
            QUERY="${QUERY}&created=>=${SINCE}"
          fi

          RUNS=$(curl -sf \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "$QUERY" | jq '.total_count // 0')

          echo "Runs CICD trouves sur $LATEST_TAG : $RUNS"
          echo "tag-found=$( [[ "$RUNS" -gt 0 ]] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT

      - name: Notify Discord if tag run is missing
        if: steps.tag-check.outputs.tag-found == 'false'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          TAG_NAME: ${{ steps.tag-check.outputs.tag-name }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions
        run: |
          set -euo pipefail
          echo "::warning::Tag $TAG_NAME cree mais aucun run CICD detecte (tag fantome potentiel)"
          echo "::warning::Reprise recommandee (reconstruit reellement l'image :RELEASE) :"
          echo "::warning::    gh workflow run cicd.yml --ref ${TAG_NAME}"
          echo "::warning::Alternative : Actions UI -> Run workflow -> deploy_tag=${TAG_NAME}"
          echo "::warning::(ce chemin ne rebuild que si l'image X.Y.Z-RELEASE est absente de GHCR)"
          if [[ -z "$DISCORD_WEBHOOK" ]]; then
            echo "DISCORD_DEPLOY_WEBHOOK non configure — notification Discord ignoree"
            exit 0
          fi
          curl -sf -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"Tag fantome detecte — Backend\",
                \"description\": \"Le tag \`${TAG_NAME}\` a ete cree par semantic-release mais **aucun run CICD** n'a ete detecte 90s apres sa creation.\\n\\nL'image \`:RELEASE\` n'a peut-etre jamais ete poussee et **le deploy PROD n'a pas eu lieu**.\\n\\n**Reprise recommandee** (rejoue tout le pipeline sur le tag et reconstruit reellement \`:RELEASE\`) :\\n\`\`\`\\ngh workflow run cicd.yml --ref ${TAG_NAME}\\n\`\`\`\\n**Alternative :** Actions UI -> Run workflow -> \`deploy_tag=${TAG_NAME}\` — ne rebuild que si l'image \`${TAG_NAME#v}-RELEASE\` est absente de GHCR.\\n[Voir les runs](${RUN_URL})\",
                \"color\": 16776960,
                \"fields\": [
                  {\"name\": \"Repo\", \"value\": \"${REPO}\", \"inline\": true},
                  {\"name\": \"Tag\", \"value\": \"\`${TAG_NAME}\`\", \"inline\": true},
                  {\"name\": \"Remediation\", \"value\": \"\`gh workflow run cicd.yml --ref ${TAG_NAME}\`\", \"inline\": false}
                ],
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }"
          echo "Notification Discord envoyee"

  # Job final pour determiner le statut global du workflow
  workflow-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, lint, test-unit, test-e2e, semgrep, sonarqube, docker, scan-image, smoke-release, deploy-preprod, deploy-prod, release, pr-report, notify, mutation-test, check-tag-run, release-rebuild]
    if: always()
    permissions: {}
    steps:
      - name: Check workflow status
        env:
          RELEASE_REBUILD_RESULT: ${{ needs.release-rebuild.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_UNIT_RESULT: ${{ needs.test-unit.result }}
          TEST_E2E_RESULT: ${{ needs.test-e2e.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          SONARQUBE_RESULT: ${{ needs.sonarqube.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          SMOKE_RELEASE_RESULT: ${{ needs.smoke-release.result }}
          DEPLOY_PREPROD_RESULT: ${{ needs.deploy-preprod.result }}
          DEPLOY_PROD_RESULT: ${{ needs.deploy-prod.result }}
          MUTATION_RESULT: ${{ needs.mutation-test.result }}
        run: |
          echo "Build status: $BUILD_RESULT"
          echo "Lint status: $LINT_RESULT"
          echo "Test (unit) status: $TEST_UNIT_RESULT"
          echo "Test (e2e) status: $TEST_E2E_RESULT"
          echo "Semgrep status: $SEMGREP_RESULT"
          echo "SonarQube status: $SONARQUBE_RESULT"
          echo "Docker status: $DOCKER_RESULT"
          echo "Deploy PREPROD status: $DEPLOY_PREPROD_RESULT"
          echo "Deploy PROD status: $DEPLOY_PROD_RESULT"

          # EPIC-39/US3 : la reprise d'une image :RELEASE manquante est bloquante.
          # Si elle echoue, docker/smoke-release/deploy-prod seront skippes et le
          # workflow paraitrait vert alors que la PROD n'a pas ete redeployee.
          if [[ "$RELEASE_REBUILD_RESULT" == "failure" || "$RELEASE_REBUILD_RESULT" == "cancelled" ]]; then
            echo "Workflow failed: release-rebuild (reprise image :RELEASE) a echoue"
            echo "Reprise complete : gh workflow run cicd.yml --ref vX.Y.Z"
            exit 1
          elif [[ "$RELEASE_REBUILD_RESULT" == "skipped" ]]; then
            echo "release-rebuild skipped (chemin workflow_dispatch + deploy_tag uniquement)"
          fi

          # Critical fast jobs: must always succeed when triggered
          if [[ "$BUILD_RESULT" == "failure" || "$BUILD_RESULT" == "cancelled" ]]; then
            echo "Workflow failed: Build job failed"
            exit 1
          fi

          if [[ "$LINT_RESULT" == "failure" || "$LINT_RESULT" == "cancelled" ]]; then
            echo "Workflow failed: Lint job failed"
            exit 1
          fi

          if [[ "$TEST_UNIT_RESULT" == "failure" || "$TEST_UNIT_RESULT" == "cancelled" ]]; then
            echo "Workflow failed: Test (unit) job failed"
            exit 1
          fi

          if [[ "$SEMGREP_RESULT" == "failure" || "$SEMGREP_RESULT" == "cancelled" ]]; then
            echo "Workflow failed: Semgrep job failed"
            exit 1
          elif [[ "$SEMGREP_RESULT" == "skipped" ]]; then
            echo "Semgrep skipped (runs on main/tag/dispatch only)"
          fi

          if [[ "$DOCKER_RESULT" == "failure" || "$DOCKER_RESULT" == "cancelled" ]]; then
            echo "Workflow failed: Docker job failed"
            exit 1
          elif [[ "$DOCKER_RESULT" == "skipped" ]]; then
            echo "Docker skipped (runs on main/tag/dispatch only)"
          fi

          # E2E est OPTIONNEL (informatif) : conditionnel au trigger, lent
          # et parfois flaky. Aucun job de deploy ne le requiert dans son
          # `needs:`. On garde donc la visibilite (badge rouge si echec) mais
          # le verdict global du workflow ne bloque pas dessus — meme
          # philosophie que sonarqube et mutation-test plus bas.
          if [[ "$TEST_E2E_RESULT" == "failure" ]]; then
            echo "Warning: Test (e2e) failed (non-blocking)"
          elif [[ "$TEST_E2E_RESULT" == "cancelled" ]]; then
            echo "Warning: Test (e2e) cancelled (non-blocking)"
          elif [[ "$TEST_E2E_RESULT" == "skipped" ]]; then
            echo "Test (e2e) skipped (not triggered - will run on PR approval or push to main)"
          elif [[ "$TEST_E2E_RESULT" == "success" ]]; then
            echo "Test (e2e) passed"
          fi

          # Smoke-release: blocking on tag pushes only. Skipped is acceptable
          # outside that context (PR/develop/main pushes never trigger it).
          if [[ "$SMOKE_RELEASE_RESULT" == "failure" || "$SMOKE_RELEASE_RESULT" == "cancelled" ]]; then
            echo "Workflow failed: Smoke release job failed"
            exit 1
          elif [[ "$SMOKE_RELEASE_RESULT" == "skipped" ]]; then
            echo "Smoke release skipped (runs on tag v* push only)"
          elif [[ "$SMOKE_RELEASE_RESULT" == "success" ]]; then
            echo "Smoke release passed"
          fi

          # Deployments: fail the workflow only if they actually ran and failed.
          if [[ "$DEPLOY_PREPROD_RESULT" == "success" ]]; then
            echo "Deploy PREPROD succeeded"
          elif [[ "$DEPLOY_PREPROD_RESULT" == "cancelled" ]]; then
            echo "Deploy PREPROD job cancelled"
            exit 1
          elif [[ "$DEPLOY_PREPROD_RESULT" == "failure" ]]; then
            echo "Workflow failed: Deploy PREPROD failed"
            exit 1
          elif [[ "$DEPLOY_PREPROD_RESULT" == "skipped" ]]; then
            echo "Deploy PREPROD skipped"
          fi

          if [[ "$DEPLOY_PROD_RESULT" == "success" ]]; then
            echo "Deploy PROD succeeded"
          elif [[ "$DEPLOY_PROD_RESULT" == "cancelled" ]]; then
            echo "Deploy PROD job cancelled"
            exit 1
          elif [[ "$DEPLOY_PROD_RESULT" == "failure" ]]; then
            echo "Workflow failed: Deploy PROD failed"
            exit 1
          elif [[ "$DEPLOY_PROD_RESULT" == "skipped" ]]; then
            echo "Deploy PROD skipped"
          fi

          # SonarQube is non-blocking (continue-on-error: true on the job)
          if [[ "$SONARQUBE_RESULT" == "failure" ]]; then
            echo "Warning: SonarQube scan failed (non-blocking)"
          elif [[ "$SONARQUBE_RESULT" == "success" ]]; then
            echo "SonarQube scan passed"
          elif [[ "$SONARQUBE_RESULT" == "skipped" ]]; then
            echo "SonarQube scan skipped"
          fi

          # Mutation testing is non-blocking (informational only)
          if [[ "$MUTATION_RESULT" == "failure" ]]; then
            echo "Warning: Mutation testing failed (non-blocking)"
          elif [[ "$MUTATION_RESULT" == "success" ]]; then
            echo "Mutation testing passed"
          elif [[ "$MUTATION_RESULT" == "skipped" ]]; then
            echo "Mutation testing skipped (not triggered)"
          fi

          echo "All critical jobs succeeded"
