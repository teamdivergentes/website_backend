name: CICD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]  # Format: vXX.YY.ZZ
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.github/dependabot.yml'
      - 'BACKLOG/**'
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:

env:
  NODE_VERSION: 22

# Cancel in-progress runs on the same branch/PR when a new push arrives.
# Avoids accumulation of stale runs (e.g. 3 consecutive update-branch pushes = 3 runs
# that would queue up and monopolize the 2 self-hosted runners).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    # Run on push/pull_request/workflow_dispatch.
    # pull_request_review and issue_comment are handled by downstream jobs directly.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, vps, docker]
    permissions:
      contents: read
    outputs:
      build-status: ${{ steps.build.outcome }}
      # Actor classification — propagated to downstream jobs to skip heavy
      # jobs on Dependabot PRs that don't justify a full pipeline run.
      #
      # is-dependabot-actions : PR bumps a GitHub Action only (.github/workflows)
      #   -> skip everything except pr-report + workflow-status
      # is-dependabot-dev     : PR bumps a devDependency (minor/patch npm)
      #   -> skip e2e, mutation-test, docker, scan-image, deploy-*, release
      # Dependabot prod dep bumps (major or prod): treated as human PRs (full pipeline)
      is-dependabot-actions: ${{ steps.actor.outputs.is-dependabot-actions }}
      is-dependabot-dev: ${{ steps.actor.outputs.is-dependabot-dev }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Classify PR actor and dependency type
        id: actor
        run: |
          IS_DEP_ACTIONS=false
          IS_DEP_DEV=false

          # Classification basee uniquement sur le prefixe de branche, pas sur github.actor.
          # Quand un humain re-run la CI ou force-push sur une branche Dependabot,
          # github.actor devient l'humain — la classification basee sur l'acteur perd
          # alors la branche et reactive le pipeline complet (Sonar inclus), ce qui
          # bloque les bumps Dependabot meme triviaux a cause du QG.
          BRANCH="${{ github.head_ref }}"

          # dependabot/github_actions/... -> only action bumps, no code change
          if [[ "$BRANCH" == dependabot/github_actions/* ]]; then
            IS_DEP_ACTIONS=true
            echo "Dependabot branch (actions): $BRANCH"
            echo "Classified as: github_actions bump (skip all except pr-report)"

          # dependabot/npm_and_yarn/... -> check package.json to classify
          elif [[ "$BRANCH" == dependabot/npm_and_yarn/* ]]; then
            echo "Dependabot branch (npm): $BRANCH"
            PKG_HINT=$(echo "$BRANCH" | sed 's|dependabot/npm_and_yarn/||' | tr '/_-' ' ' | tr '[:upper:]' '[:lower:]')
            echo "Package hint: $PKG_HINT"

            # Classify as devDep if the package name fragment matches a devDependency key
            if node -e "
              const pkg = require('./package.json');
              const hint = process.argv[1].toLowerCase();
              const devKeys = Object.keys(pkg.devDependencies || {}).map(k => k.toLowerCase().replace(/[@\/]/g, ''));
              const isDev = devKeys.some(k => hint.includes(k) || k.includes(hint.split(' ')[0]));
              process.exit(isDev ? 0 : 1);
            " "$PKG_HINT" 2>/dev/null; then
              IS_DEP_DEV=true
              echo "Classified as: devDependency bump (skip docker/e2e/deploy)"
            else
              echo "Classified as: prod/unknown dependency bump (full pipeline)"
            fi
          fi

          echo "is-dependabot-actions=$IS_DEP_ACTIONS" >> $GITHUB_OUTPUT
          echo "is-dependabot-dev=$IS_DEP_DEV" >> $GITHUB_OUTPUT

      - name: Setup Node
        # Skip full setup for action-only bumps (no code to build)
        if: steps.actor.outputs.is-dependabot-actions != 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        if: steps.actor.outputs.is-dependabot-actions != 'true'
        id: cache-modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.actor.outputs.is-dependabot-actions != 'true' && steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate Prisma Client
        if: steps.actor.outputs.is-dependabot-actions != 'true'
        run: npx prisma generate

      - name: Build NestJS
        if: steps.actor.outputs.is-dependabot-actions != 'true'
        id: build
        run: npm run build

      # For github_actions bumps there is no code to build — mark as success via echo
      - name: Skip build (github_actions bump)
        if: steps.actor.outputs.is-dependabot-actions == 'true'
        run: echo "Skipping build — github_actions Dependabot bump, no application code changed."

  lint:
    runs-on: [self-hosted, linux, vps, docker]
    needs: build
    # Skip for github_actions bumps (no code changed)
    if: |
      needs.build.result == 'success' &&
      needs.build.outputs.is-dependabot-actions != 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

  # Fast job: unit tests only (Jest, no E2E).
  # Runs on every push/PR (except github_actions bumps) — gating job for Docker and deployments.
  test-unit:
    runs-on: [self-hosted, linux, vps, docker]
    needs: build
    if: |
      needs.build.result == 'success' &&
      needs.build.outputs.is-dependabot-actions != 'true'
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        # Runner-in-Docker topology: the runner process runs inside a container
        # that mounts the Docker socket. Service containers land on github_network_*
        # with the alias "postgres". The "Resolve postgres host" step below connects
        # the runner container to that network so "postgres:5432" becomes reachable.
        # The random host port (-p 5432) is kept for compat but no longer used.
        ports:
          - 5432

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve postgres host
        # Runner-in-Docker topology (myoung34/github-runner with Docker socket mount):
        # - The runner process runs inside a container on the "bridge" network.
        # - Service containers (postgres) are created on a per-job "github_network_*"
        #   bridge network.
        #
        # Root cause (PRs #91/#92): `docker network connect` attaches the runner to
        #   the overlay network at the kernel level but does NOT update the in-container
        #   DNS resolver (127.0.0.11). The "postgres" alias therefore never resolves
        #   even though the network is reachable, causing Prisma P1001 timeout.
        #
        # Fix: bypass DNS entirely. Inspect the postgres container's IP on the
        #   github_network_* via `docker inspect` and export it as PGHOST.
        #   TCP routing to the IP works as soon as the runner is connected to the
        #   network — no DNS resolution required.
        #
        # Fallback: native VPS runner (no runner container) falls back to
        #   localhost + host-mapped port (pre-#90 behaviour).
        id: pg-host
        run: |
          RUNNER_ID=$(hostname)
          # Find the github_network_* created for this job
          PG_NETWORK=$(docker network ls --format '{{.Name}}' | grep '^github_network_' | head -1)
          if [ -z "$PG_NETWORK" ]; then
            echo "ERROR: No github_network_* found" >&2
            exit 1
          fi
          echo "Found service network: ${PG_NETWORK}"

          # Locate the postgres service container on the github_network_*
          PG_CONTAINER=$(docker ps --filter "network=${PG_NETWORK}" --format '{{.ID}}' | head -1)
          if [ -z "$PG_CONTAINER" ]; then
            echo "ERROR: No container found on ${PG_NETWORK}" >&2
            exit 1
          fi

          # Get the postgres container IP directly (avoids DNS resolver entirely)
          PG_IP=$(docker inspect "${PG_CONTAINER}" \
            --format "{{(index .NetworkSettings.Networks \"${PG_NETWORK}\").IPAddress}}")
          echo "Postgres container IP on ${PG_NETWORK}: ${PG_IP}"

          # Connect the runner container to the network so TCP routing works.
          # Tolerate "already connected" (re-run) and fall back for native runners.
          CONNECT_OUT=$(docker network connect "${PG_NETWORK}" "${RUNNER_ID}" 2>&1) && CONNECT_RC=0 || CONNECT_RC=$?
          if [ $CONNECT_RC -eq 0 ]; then
            echo "Runner container connected to ${PG_NETWORK}"
          elif echo "$CONNECT_OUT" | grep -q "already exists in network"; then
            echo "Runner container already connected (re-run)"
          else
            echo "Network connect failed (native runner?): ${CONNECT_OUT}"
            echo "Falling back to localhost + host-mapped port"
            PG_HOST_PORT=$(docker inspect "${PG_CONTAINER}" \
              --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}')
            echo "PGHOST=localhost" >> $GITHUB_OUTPUT
            echo "PGPORT=${PG_HOST_PORT}" >> $GITHUB_OUTPUT
            echo "Postgres reachable at localhost:${PG_HOST_PORT}"
            exit 0
          fi

          # Export the direct IP — no DNS dependency
          echo "PGHOST=${PG_IP}" >> $GITHUB_OUTPUT
          echo "PGPORT=5432" >> $GITHUB_OUTPUT
          echo "DATABASE_URL will use ${PG_IP}:5432 (direct IP, no DNS)"

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma migrations
        env:
          DATABASE_URL: postgresql://testuser:testpass@${{ steps.pg-host.outputs.PGHOST }}:${{ steps.pg-host.outputs.PGPORT }}/testdb
        run: npx prisma migrate deploy

      - name: Validate schema drift (replaces validate-migrations job)
        # Compares the live schema (after migrate deploy) with prisma/schema.prisma.
        # Catches schema drift without needing a separate job + service postgres.
        # Local equivalent: pre-push Husky hook on backend/prisma/* changes.
        # --to-url reads the live database directly (no shadow DB needed).
        run: |
          npx prisma migrate diff \
            --from-schema-datamodel prisma/schema.prisma \
            --to-url "$DATABASE_URL" \
            --exit-code
        env:
          DATABASE_URL: postgresql://testuser:testpass@${{ steps.pg-host.outputs.PGHOST }}:${{ steps.pg-host.outputs.PGPORT }}/testdb

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://testuser:testpass@${{ steps.pg-host.outputs.PGHOST }}:${{ steps.pg-host.outputs.PGPORT }}/testdb
          JWT_SECRET: test-secret-key-for-ci
          JWT_EXPIRES_IN: 1h
          NODE_ENV: test
        run: npm run test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 1

  # Slow job: NestJS E2E tests (supertest against a real Postgres).
  # Triggers: push to main, tag, PR approval, /run-e2e comment on PR, or workflow_dispatch.
  # NOT triggered on every PR push to keep pipelines fast.
  # NOT triggered for Dependabot action bumps or dev dep bumps.
  # Note: github.event.comment.body is used only in if: expression context (not in run:) - safe.
  test-e2e:
    runs-on: [self-hosted, linux, vps, docker]
    needs: build
    if: |
      needs.build.outputs.is-dependabot-actions != 'true' &&
      needs.build.outputs.is-dependabot-dev != 'true' &&
      (
        (github.event_name == 'push') ||
        (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.body == '/run-e2e') ||
        (github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        # See test-unit for topology explanation. Runner is connected to github_network_* in Resolve step.
        ports:
          - 5432

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve postgres host
        # See test-unit for full topology explanation and root cause analysis.
        # Fix: use direct IP from docker inspect instead of DNS alias "postgres".
        id: pg-host
        run: |
          RUNNER_ID=$(hostname)
          PG_NETWORK=$(docker network ls --format '{{.Name}}' | grep '^github_network_' | head -1)
          if [ -z "$PG_NETWORK" ]; then
            echo "ERROR: No github_network_* found" >&2
            exit 1
          fi
          echo "Found service network: ${PG_NETWORK}"
          PG_CONTAINER=$(docker ps --filter "network=${PG_NETWORK}" --format '{{.ID}}' | head -1)
          if [ -z "$PG_CONTAINER" ]; then
            echo "ERROR: No container found on ${PG_NETWORK}" >&2
            exit 1
          fi
          PG_IP=$(docker inspect "${PG_CONTAINER}" \
            --format "{{(index .NetworkSettings.Networks \"${PG_NETWORK}\").IPAddress}}")
          echo "Postgres container IP on ${PG_NETWORK}: ${PG_IP}"
          CONNECT_OUT=$(docker network connect "${PG_NETWORK}" "${RUNNER_ID}" 2>&1) && CONNECT_RC=0 || CONNECT_RC=$?
          if [ $CONNECT_RC -eq 0 ]; then
            echo "Runner container connected to ${PG_NETWORK}"
          elif echo "$CONNECT_OUT" | grep -q "already exists in network"; then
            echo "Runner container already connected (re-run)"
          else
            echo "Network connect failed (native runner?): ${CONNECT_OUT}"
            PG_HOST_PORT=$(docker inspect "${PG_CONTAINER}" \
              --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}')
            echo "PGHOST=localhost" >> $GITHUB_OUTPUT
            echo "PGPORT=${PG_HOST_PORT}" >> $GITHUB_OUTPUT
            echo "Postgres reachable at localhost:${PG_HOST_PORT}"
            exit 0
          fi
          echo "PGHOST=${PG_IP}" >> $GITHUB_OUTPUT
          echo "PGPORT=5432" >> $GITHUB_OUTPUT
          echo "DATABASE_URL will use ${PG_IP}:5432 (direct IP, no DNS)"

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma migrations
        env:
          DATABASE_URL: postgresql://testuser:testpass@${{ steps.pg-host.outputs.PGHOST }}:${{ steps.pg-host.outputs.PGPORT }}/testdb
        run: npx prisma migrate deploy

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://testuser:testpass@${{ steps.pg-host.outputs.PGHOST }}:${{ steps.pg-host.outputs.PGPORT }}/testdb
          JWT_SECRET: test-secret-key-for-ci
          JWT_EXPIRES_IN: 1h
          NODE_ENV: test
        run: npm run test:e2e

  # Mutation testing with Stryker Mutator
  # Triggers: push to main, PR approval, /run-mutation comment, workflow_dispatch.
  # NOT triggered for Dependabot PRs (no new application code to mutate).
  # Non-blocking — reports mutation score as artifact.
  mutation-test:
    runs-on: [self-hosted, linux, vps, docker]
    needs: build
    if: |
      needs.build.outputs.is-dependabot-actions != 'true' &&
      needs.build.outputs.is-dependabot-dev != 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.body == '/run-mutation') ||
        (github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        # See test-unit for topology explanation. Runner is connected to github_network_* in Resolve step.
        ports:
          - 5432

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Fetch main branch for incremental analysis
        if: github.ref != 'refs/heads/main'
        run: git fetch origin main:refs/remotes/origin/main --depth=1

      - name: Resolve postgres host
        # See test-unit for full topology explanation and root cause analysis.
        # Fix: use direct IP from docker inspect instead of DNS alias "postgres".
        id: pg-host
        run: |
          RUNNER_ID=$(hostname)
          PG_NETWORK=$(docker network ls --format '{{.Name}}' | grep '^github_network_' | head -1)
          if [ -z "$PG_NETWORK" ]; then
            echo "ERROR: No github_network_* found" >&2
            exit 1
          fi
          echo "Found service network: ${PG_NETWORK}"
          PG_CONTAINER=$(docker ps --filter "network=${PG_NETWORK}" --format '{{.ID}}' | head -1)
          if [ -z "$PG_CONTAINER" ]; then
            echo "ERROR: No container found on ${PG_NETWORK}" >&2
            exit 1
          fi
          PG_IP=$(docker inspect "${PG_CONTAINER}" \
            --format "{{(index .NetworkSettings.Networks \"${PG_NETWORK}\").IPAddress}}")
          echo "Postgres container IP on ${PG_NETWORK}: ${PG_IP}"
          CONNECT_OUT=$(docker network connect "${PG_NETWORK}" "${RUNNER_ID}" 2>&1) && CONNECT_RC=0 || CONNECT_RC=$?
          if [ $CONNECT_RC -eq 0 ]; then
            echo "Runner container connected to ${PG_NETWORK}"
          elif echo "$CONNECT_OUT" | grep -q "already exists in network"; then
            echo "Runner container already connected (re-run)"
          else
            echo "Network connect failed (native runner?): ${CONNECT_OUT}"
            PG_HOST_PORT=$(docker inspect "${PG_CONTAINER}" \
              --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}')
            echo "PGHOST=localhost" >> $GITHUB_OUTPUT
            echo "PGPORT=${PG_HOST_PORT}" >> $GITHUB_OUTPUT
            echo "Postgres reachable at localhost:${PG_HOST_PORT}"
            exit 0
          fi
          echo "PGHOST=${PG_IP}" >> $GITHUB_OUTPUT
          echo "PGPORT=5432" >> $GITHUB_OUTPUT
          echo "DATABASE_URL will use ${PG_IP}:5432 (direct IP, no DNS)"

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma migrations
        env:
          DATABASE_URL: postgresql://testuser:testpass@${{ steps.pg-host.outputs.PGHOST }}:${{ steps.pg-host.outputs.PGPORT }}/testdb
        run: npx prisma migrate deploy

      - name: Determine Stryker mode
        id: stryker-mode
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "args=" >> $GITHUB_OUTPUT
            echo "Running full mutation analysis"
          else
            echo "args=--since origin/main" >> $GITHUB_OUTPUT
            echo "Running incremental mutation analysis (changed files only)"
          fi

      - name: Run mutation tests
        env:
          DATABASE_URL: postgresql://testuser:testpass@${{ steps.pg-host.outputs.PGHOST }}:${{ steps.pg-host.outputs.PGPORT }}/testdb
          JWT_SECRET: test-secret-key-for-ci
          JWT_EXPIRES_IN: 1h
          NODE_ENV: test
        run: npx stryker run ${{ steps.stryker-mode.outputs.args }}
        continue-on-error: true

      - name: Upload Stryker report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stryker-mutation-report
          path: reports/mutation/
          retention-days: 7

      - name: Write Stryker summary to GitHub Step Summary
        if: always()
        run: |
          {
            echo "## 🧬 Mutation testing (Stryker)"
            echo ""
            if [[ -f reports/mutation/mutation.json ]]; then
              # Extract score from report (Stryker JSON format)
              SCORE=$(node -e "const r=require('./reports/mutation/mutation.json'); console.log(r.thresholds ? r.thresholds.high : 'n/a')" 2>/dev/null || echo "n/a")
              KILLED=$(node -e "const r=require('./reports/mutation/mutation.json'); const f=Object.values(r.files || {}); console.log(f.reduce((a,x)=>a+(x.mutants?.filter(m=>m.status==='Killed').length||0),0))" 2>/dev/null || echo "n/a")
              SURVIVED=$(node -e "const r=require('./reports/mutation/mutation.json'); const f=Object.values(r.files || {}); console.log(f.reduce((a,x)=>a+(x.mutants?.filter(m=>m.status==='Survived').length||0),0))" 2>/dev/null || echo "n/a")
              echo "- Mutation score threshold (high): **${SCORE}%**"
              echo "- Mutants killed : ${KILLED}"
              echo "- Mutants survived : ${SURVIVED}"
            else
              echo "_No mutation report found (mutation.json missing)._"
            fi
            echo ""
            echo "Full HTML report : artifact \`stryker-mutation-report\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Note: the `validate-migrations` job has been removed in favor of
  # an inline `Validate schema drift` step in `test-unit` (uses the same
  # postgres service), and a Husky pre-push hook on backend/prisma/* changes.

  semgrep:
    runs-on: [self-hosted, linux, vps, docker]
    needs: build
    # SAST: main/tag/dispatch only — saves ~3 min per PR push.
    # Never runs for Dependabot (no new application code to scan).
    if: |
      (github.actor != 'dependabot[bot]') &&
      needs.build.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep
        run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # SonarQube analysis — BLOCKING. Quality Gate (Sonar way) must pass.
  # Runs after unit tests to include coverage from the test-unit artifact.
  # Triggers: push/PR/workflow_dispatch (same gates as the rest of the pipeline).
  # Skipped for Dependabot github_actions bumps (no application code changed).
  # QG conditions (on New Code): 0 new issues, >=80% new coverage,
  # <=3% new duplicated lines, 100% new security hotspots reviewed.
  # See docs/SONARQUBE.md for details.
  sonarqube:
    runs-on: [self-hosted, linux, vps, docker]
    needs: [build, test-unit]
    if: |
      needs.build.outputs.is-dependabot-actions != 'true' &&
      needs.build.result == 'success' &&
      needs.test-unit.result == 'success' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'pull_request' ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # fetch-depth: 0 is required for SonarQube blame analysis and branch detection
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: coverage-lcov
          path: coverage/

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@aa494459d7c39c106cc77b166de8b4250a32bb97 # v5.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DVG }}
          SONAR_HOST_URL: https://sonarqube.tellebma.fr

      - name: Check SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DVG }}
          SONAR_HOST_URL: https://sonarqube.tellebma.fr

  # Docker depends on fast jobs only (test-unit, not test-e2e) plus the Sonar QG.
  # Sonar QG blocks Docker build -> no image is published if quality fails.
  # Skipped for Dependabot dev-dep and action bumps (no production code changed).
  docker:
    runs-on: [self-hosted, linux, vps, docker]
    needs: [build, lint, test-unit, semgrep, sonarqube]
    if: |
      !cancelled() &&
      needs.build.outputs.is-dependabot-actions != 'true' &&
      needs.build.outputs.is-dependabot-dev != 'true' &&
      needs.build.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test-unit.result == 'success' &&
      (needs.semgrep.result == 'success' || needs.semgrep.result == 'skipped') &&
      (needs.sonarqube.result == 'success' || needs.sonarqube.result == 'skipped')
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tags.outputs.image-tag }}
      workflow-tag: ${{ steps.tags.outputs.workflow-tag }}
      version-tag: ${{ steps.tags.outputs.version-tag }}
      tag-suffix: ${{ steps.tags.outputs.tag-suffix }}
      image-name: ${{ steps.tags.outputs.image-name }}
      deploy-tag: ${{ steps.tags.outputs.deploy-tag }}
      image-digest: ${{ steps.build-image.outputs.digest }}
      docker-status: ${{ job.status }}
    env:
      BUILD_STATUS: ${{ needs.build.result }}
      LINT_STATUS: ${{ needs.lint.result }}
      TEST_STATUS: ${{ needs.test-unit.result }}
      SEMGREP_STATUS: ${{ needs.semgrep.result }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_HEAD_REF: ${{ github.head_ref || github.ref_name }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Determine image tags
        id: tags
        run: |
          chmod +x ./.github/scripts/determine-tags.sh
          ./.github/scripts/determine-tags.sh

      - name: Update Dockerfile with build labels
        id: labels
        run: |
          chmod +x ./.github/scripts/update-dockerfile-labels.sh
          ./.github/scripts/update-dockerfile-labels.sh \
            "${{ steps.tags.outputs.image-tag }}" \
            "${{ steps.tags.outputs.workflow-tag }}" \
            "${{ steps.tags.outputs.tag-suffix }}" \
            "${{ env.BUILD_STATUS }}" \
            "${{ env.LINT_STATUS }}" \
            "${{ env.TEST_STATUS }}" \
            "${{ env.SEMGREP_STATUS }}" \
            "${{ env.GITHUB_SHA }}" \
            "${{ env.GITHUB_HEAD_REF }}" \
            "${{ env.GITHUB_ACTOR }}" \
            "${{ env.BUILD_TIME }}" \
            "${{ env.GITHUB_REPOSITORY }}"

          # Extraire les labels du Dockerfile pour les passer a docker/build-push-action
          if [[ -f "Dockerfile" ]]; then
            grep "^LABEL " Dockerfile | sed 's/^LABEL //' > labels_temp.txt

            if [[ -s "labels_temp.txt" ]]; then
              while IFS= read -r line; do
                if [[ "$line" =~ [\;\|\&\`\$\(\)] ]]; then
                  echo "Warning: Label dangereux detecte et ignore: $line"
                  continue
                fi
                echo "$line" >> labels_output.txt
              done < labels_temp.txt

              if [[ -f "labels_output.txt" && -s "labels_output.txt" ]]; then
                echo "labels<<EOF" >> $GITHUB_OUTPUT
                cat labels_output.txt >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT
              else
                echo "Warning: Aucun label valide trouve dans le Dockerfile"
              fi
            else
              echo "Warning: Aucun label trouve dans le Dockerfile"
            fi

            rm -f labels_temp.txt labels_output.txt
          else
            echo "Dockerfile non trouve"
            exit 1
          fi
        env:
          BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.repository.pushed_at || github.event.repository.updated_at }}

      - name: Build and Push Docker image
        id: build-image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v6.4.1
        with:
          context: .
          push: true
          # platforms: linux/amd64,linux/arm64  # Multi-arch desactive : serveur cible amd64 uniquement
          platforms: linux/amd64
          tags: |
            ${{ steps.tags.outputs.image-tag }}
            ${{ steps.tags.outputs.workflow-tag }}
            ${{ steps.tags.outputs.version-tag }}
          labels: ${{ steps.labels.outputs.labels }}
          # Cache : sur le runner self-hosted, le backend cache GHA (type=gha)
          # renvoie regulierement des HTTP 400 et declenche des retries qui
          # font durer le build 30+ min. On utilise type=registry (cache pousse
          # dans GHCR sous un tag dedie) qui ne depend pas du backend GHA
          # interne et profite a tous les runners.
          cache-from: type=registry,ref=${{ steps.tags.outputs.image-name }}:buildcache
          cache-to: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.pull_request.title || '', '[DEPLOY]')) && format('type=registry,ref={0}:buildcache,mode=max', steps.tags.outputs.image-name) || '' }}

  scan-image:
    runs-on: [self-hosted, linux, vps, docker]
    needs: [docker]
    if: ${{ !cancelled() && needs.docker.result == 'success' }}
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SECURITY: Trivy was compromised in a supply chain attack (March 2026).
      # Only SHA 57a97c7 (v0.35.0) is verified safe. Do NOT update without verification.
      # See: https://github.com/aquasecurity/trivy/security/advisories/GHSA-69fq-xp46-6x23
      # Informational scan — table output visible in job logs
      - name: Run Trivy vulnerability scanner (table)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (verified safe)
        with:
          image-ref: ${{ needs.docker.outputs.image-tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      # SARIF report for GitHub Security tab
      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (verified safe)
        with:
          image-ref: ${{ needs.docker.outputs.image-tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

  # Deploiement PREPROD (push sur main ou PR avec [DEPLOY])
  deploy-preprod:
    runs-on: ubuntu-latest
    needs: [build, lint, test-unit, semgrep, docker, scan-image]
    if: |
      !cancelled() &&
      (github.ref == 'refs/heads/main' ||
       (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[DEPLOY]'))) &&
      needs.build.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test-unit.result == 'success' &&
      (needs.semgrep.result == 'success' || needs.semgrep.result == 'skipped') &&
      needs.docker.result == 'success' &&
      needs.scan-image.result == 'success'
    environment:
      name: preprod
      url: https://preprod-api.teamdivergentes.fr
    permissions:
      contents: read
    outputs:
      deploy-status: ${{ steps.set-status.outputs.deploy-status }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy to PREPROD
        id: deploy
        env:
          DEPLOY_REPO: ${{ secrets.DEPLOY_REPO }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          IMAGE_REPO: ${{ needs.docker.outputs.image-name }}
        run: |
          chmod +x ./.github/scripts/deploy.sh
          ./.github/scripts/deploy.sh "PREPROD" "website"

      - name: Set deployment status
        id: set-status
        if: always()
        run: echo "deploy-status=${{ steps.deploy.outcome }}" >> $GITHUB_OUTPUT

  # Deploiement PROD (tag vX.Y.Z)
  deploy-prod:
    runs-on: ubuntu-latest
    needs: [build, lint, test-unit, semgrep, docker, scan-image]
    if: |
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test-unit.result == 'success' &&
      (needs.semgrep.result == 'success' || needs.semgrep.result == 'skipped') &&
      needs.docker.result == 'success' &&
      needs.scan-image.result == 'success'
    environment:
      name: production
      url: https://api.teamdivergentes.fr
    permissions:
      contents: read
    outputs:
      deploy-status: ${{ steps.set-status.outputs.deploy-status }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy to PROD
        id: deploy-prod
        env:
          DEPLOY_REPO: ${{ secrets.DEPLOY_REPO }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          IMAGE_REPO: ${{ needs.docker.outputs.image-name }}
        run: |
          chmod +x ./.github/scripts/deploy.sh
          ./.github/scripts/deploy.sh "PROD" "website"

      - name: Set deployment status
        id: set-status
        if: always()
        run: echo "deploy-status=${{ steps.deploy-prod.outcome }}" >> $GITHUB_OUTPUT

  pr-report:
    runs-on: ubuntu-latest
    needs: [build, lint, test-unit, test-e2e, semgrep, docker, scan-image, deploy-preprod, deploy-prod]
    if: |
      always() &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request != null))
    continue-on-error: true
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      BUILD_STATUS: ${{ needs.build.result }}
      LINT_STATUS: ${{ needs.lint.result }}
      TEST_STATUS: ${{ needs.test-unit.result }}
      E2E_STATUS: ${{ needs.test-e2e.result || 'skipped' }}
      SEMGREP_STATUS: ${{ needs.semgrep.result }}
      DOCKER_STATUS: ${{ needs.docker.result }}
      DEPLOY_PREPROD_STATUS: ${{ needs.deploy-preprod.result || 'skipped' }}
      DEPLOY_PROD_STATUS: ${{ needs.deploy-prod.result || 'skipped' }}
      IMAGE_TAG: ${{ needs.docker.outputs.image-tag || 'N/A' }}
      WORKFLOW_TAG: ${{ needs.docker.outputs.workflow-tag || 'N/A' }}
      VERSION_TAG: ${{ needs.docker.outputs.version-tag || 'N/A' }}
      TAG_SUFFIX: ${{ needs.docker.outputs.tag-suffix || 'N/A' }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_HEAD_REF: ${{ github.head_ref || github.ref_name }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_EVENT_NUMBER: ${{ github.event.number || github.event.issue.number }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generer le rapport de PR
        id: report
        run: |
          chmod +x ./.github/scripts/generate-pr-report.sh
          ./.github/scripts/generate-pr-report.sh
          echo "report-generated=true" >> $GITHUB_OUTPUT

      - name: Comment PR
        run: |
          chmod +x ./.github/scripts/publish-pr-comment.cjs
          node ./.github/scripts/publish-pr-comment.cjs

  # ADD-003 : Notification Discord apres deploiement
  notify:
    if: always() && (needs.deploy-preprod.result != 'skipped' || needs.deploy-prod.result != 'skipped')
    needs: [deploy-preprod, deploy-prod]
    uses: ./.github/workflows/discord-notify.yml
    with:
      environment: ${{ needs.deploy-prod.result != 'skipped' && 'PRODUCTION' || 'PREPROD' }}
      status: ${{ needs.deploy-prod.result != 'skipped' && needs.deploy-prod.result || needs.deploy-preprod.result }}
      repository: ${{ github.repository }}
      actor: ${{ github.actor }}
      sha: ${{ github.sha }}
      url: ${{ needs.deploy-prod.result != 'skipped' && 'https://api.teamdivergentes.fr' || 'https://preprod-api.teamdivergentes.fr' }}
    secrets:
      DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}

  # Semantic Release (auto-tag sur main)
  release:
    runs-on: ubuntu-latest
    needs: [build, lint, test-unit, semgrep, docker]
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release)') &&
      needs.build.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test-unit.result == 'success' &&
      (needs.semgrep.result == 'success' || needs.semgrep.result == 'skipped') &&
      needs.docker.result == 'success'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git credentials for tag push
        run: git remote set-url origin "https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@teamdivergentes.fr
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@teamdivergentes.fr
        run: npx semantic-release

  # Job final pour determiner le statut global du workflow
  workflow-status:
    runs-on: ubuntu-latest
    needs: [build, lint, test-unit, test-e2e, semgrep, sonarqube, docker, scan-image, deploy-preprod, deploy-prod, release, pr-report, notify, mutation-test]
    if: always()
    permissions: {}
    steps:
      - name: Check workflow status
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_UNIT_RESULT: ${{ needs.test-unit.result }}
          TEST_E2E_RESULT: ${{ needs.test-e2e.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          SONARQUBE_RESULT: ${{ needs.sonarqube.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          DEPLOY_PREPROD_RESULT: ${{ needs.deploy-preprod.result }}
          DEPLOY_PROD_RESULT: ${{ needs.deploy-prod.result }}
          MUTATION_RESULT: ${{ needs.mutation-test.result }}
        run: |
          echo "Build status: $BUILD_RESULT"
          echo "Lint status: $LINT_RESULT"
          echo "Test (unit) status: $TEST_UNIT_RESULT"
          echo "Test (e2e) status: $TEST_E2E_RESULT"
          echo "Semgrep status: $SEMGREP_RESULT"
          echo "SonarQube status: $SONARQUBE_RESULT"
          echo "Docker status: $DOCKER_RESULT"
          echo "Deploy PREPROD status: $DEPLOY_PREPROD_RESULT"
          echo "Deploy PROD status: $DEPLOY_PROD_RESULT"

          # Critical fast jobs: must always succeed when triggered
          if [[ "$BUILD_RESULT" == "failure" || "$BUILD_RESULT" == "cancelled" ]]; then
            echo "Workflow failed: Build job failed"
            exit 1
          fi

          if [[ "$LINT_RESULT" == "failure" || "$LINT_RESULT" == "cancelled" ]]; then
            echo "Workflow failed: Lint job failed"
            exit 1
          fi

          if [[ "$TEST_UNIT_RESULT" == "failure" || "$TEST_UNIT_RESULT" == "cancelled" ]]; then
            echo "Workflow failed: Test (unit) job failed"
            exit 1
          fi

          if [[ "$SEMGREP_RESULT" == "failure" || "$SEMGREP_RESULT" == "cancelled" ]]; then
            echo "Workflow failed: Semgrep job failed"
            exit 1
          elif [[ "$SEMGREP_RESULT" == "skipped" ]]; then
            echo "Semgrep skipped (runs on main/tag/dispatch only)"
          fi

          if [[ "$DOCKER_RESULT" == "failure" || "$DOCKER_RESULT" == "cancelled" ]]; then
            echo "Workflow failed: Docker job failed"
            exit 1
          elif [[ "$DOCKER_RESULT" == "skipped" ]]; then
            echo "Docker skipped (runs on main/tag/dispatch only)"
          fi

          # E2E is conditional: only fail the workflow if it actually ran and failed.
          # skipped = not yet triggered (normal on PR push), which is acceptable.
          if [[ "$TEST_E2E_RESULT" == "failure" || "$TEST_E2E_RESULT" == "cancelled" ]]; then
            echo "Workflow failed: Test (e2e) job failed"
            exit 1
          elif [[ "$TEST_E2E_RESULT" == "skipped" ]]; then
            echo "Test (e2e) skipped (not triggered - will run on PR approval or push to main)"
          elif [[ "$TEST_E2E_RESULT" == "success" ]]; then
            echo "Test (e2e) passed"
          fi

          # Deployments: fail the workflow only if they actually ran and failed.
          if [[ "$DEPLOY_PREPROD_RESULT" == "success" ]]; then
            echo "Deploy PREPROD succeeded"
          elif [[ "$DEPLOY_PREPROD_RESULT" == "cancelled" ]]; then
            echo "Deploy PREPROD job cancelled"
            exit 1
          elif [[ "$DEPLOY_PREPROD_RESULT" == "failure" ]]; then
            echo "Workflow failed: Deploy PREPROD failed"
            exit 1
          elif [[ "$DEPLOY_PREPROD_RESULT" == "skipped" ]]; then
            echo "Deploy PREPROD skipped"
          fi

          if [[ "$DEPLOY_PROD_RESULT" == "success" ]]; then
            echo "Deploy PROD succeeded"
          elif [[ "$DEPLOY_PROD_RESULT" == "cancelled" ]]; then
            echo "Deploy PROD job cancelled"
            exit 1
          elif [[ "$DEPLOY_PROD_RESULT" == "failure" ]]; then
            echo "Workflow failed: Deploy PROD failed"
            exit 1
          elif [[ "$DEPLOY_PROD_RESULT" == "skipped" ]]; then
            echo "Deploy PROD skipped"
          fi

          # SonarQube is non-blocking (continue-on-error: true on the job)
          if [[ "$SONARQUBE_RESULT" == "failure" ]]; then
            echo "Warning: SonarQube scan failed (non-blocking)"
          elif [[ "$SONARQUBE_RESULT" == "success" ]]; then
            echo "SonarQube scan passed"
          elif [[ "$SONARQUBE_RESULT" == "skipped" ]]; then
            echo "SonarQube scan skipped"
          fi

          # Mutation testing is non-blocking (informational only)
          if [[ "$MUTATION_RESULT" == "failure" ]]; then
            echo "Warning: Mutation testing failed (non-blocking)"
          elif [[ "$MUTATION_RESULT" == "success" ]]; then
            echo "Mutation testing passed"
          elif [[ "$MUTATION_RESULT" == "skipped" ]]; then
            echo "Mutation testing skipped (not triggered)"
          fi

          echo "All critical jobs succeeded"
