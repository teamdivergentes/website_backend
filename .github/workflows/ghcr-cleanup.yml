name: Cleanup GHCR Images

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '0 3 * * 0'  # Dimanche 3h UTC

permissions: {}

jobs:
  cleanup:
    runs-on: [self-hosted, linux, vps, docker]
    permissions:
      packages: write
    steps:
      - name: Delete untagged images
        uses: actions/delete-package-versions@e5173a628f73841b8756b1d5b29ca72c9f53e1b2 # v5.0.0
        with:
          package-name: website_backend/dvg_web_backend
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true

      - name: Delete old unstable images
        uses: actions/delete-package-versions@e5173a628f73841b8756b1d5b29ca72c9f53e1b2 # v5.0.0
        with:
          package-name: website_backend/dvg_web_backend
          package-type: container
          min-versions-to-keep: 5
          ignore-versions: '^(RELEASE|PREPROD)$'
