# ============================================================
# SonarQube - Team Divergentes Backend
# Instance : https://sonarqube.tellebma.fr/
# ============================================================

sonar.projectKey=dvg-backend
sonar.projectName=Team Divergentes - Backend

# Sources et tests
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts

# Exclusions de l'analyse principale
sonar.exclusions=\
  **/node_modules/**, \
  **/dist/**, \
  **/generated/**, \
  **/coverage/**, \
  **/*.spec.ts, \
  **/*.e2e-spec.ts, \
  **/prisma/migrations/**

# Exclusions de la mesure de coverage
# DTOs, modules, main.ts et fichiers de config n'ont pas de logique testable
sonar.coverage.exclusions=\
  **/main.ts, \
  **/*.module.ts, \
  **/*.dto.ts, \
  **/prisma/migrations/**, \
  **/prisma/seed.ts, \
  src/app.module.ts, \
  src/app.controller.ts, \
  src/app.service.ts

# Coverage LCOV (genere par Jest avec coverageReporters: ["lcov"])
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Encodage
sonar.sourceEncoding=UTF-8

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

# Issue rules ignorance
# S2699 ("Add at least one assertion") est un faux positif sur les e2e specs
# qui utilisent supertest .expect(...) et toMatchObject — non reconnus par
# Sonar comme assertions Jest. Ces tests assertent bien leur comportement
# via le code HTTP et la forme de la reponse.
sonar.issue.ignore.multicriteria=e2e_assertions
sonar.issue.ignore.multicriteria.e2e_assertions.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.e2e_assertions.resourceKey=test/**/*.e2e-spec.ts
